<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Judging · ByteFest 2026</title>
<meta name="description" content="ByteFest 2026 judging and results. For judges and organisers only.">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  /* same theme key as the main site, applied before first paint so light-mode users never see a dark flash */
  try { if (localStorage.getItem("bf-theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000000; --panel:#000614; --signal:#003DA6; --signal-hot:#4D8BFF; --ember:#0A2A6B;
  --bone:#EEF2FA; --ash:#8E9AB3; --grid:rgba(77,139,255,.08);
  --teal:#19D3C5; --teal-deep:#0B8F85; --teal-ink:#001a18; --sel:#065EAD;
  --glass-bg:rgba(255,255,255,.06); --glass-brd:rgba(25,211,197,.45); --glass-hi:rgba(255,255,255,.14);
  --glass-shadow:0 6px 28px rgba(0,0,0,.45);
  --bar:rgba(3,9,26,.72); --field:rgba(0,0,0,.38); --line:rgba(77,139,255,.18);
  --glow1:#001d5c; --glow2:#000512;
  --menu:#030a1c;
  --hero1:#000000; --hero2:#000512; --hero3:#001033; --hero4:#001d5c;   /* the home page's sky */
  --moon-top:9%; --moon-right:9%; --moon-op:1; --sun-top:110%; --sun-right:30%; --sun-op:0;
  --gold-t:rgba(255,211,107,.24); --silver-t:rgba(215,225,240,.18); --bronze-t:rgba(224,163,107,.22);
  --sk-body:#000a22; --sk-lit:#7FB0FF;   /* darker than the home page: here the city sits on the sky's brightest band */
  --gold:#FFD36B; --silver:#D7E1F0; --bronze:#E0A36B; --ok:#19D3C5; --bad:#FF6B6B;
  --px:"Silkscreen","Courier New",monospace;
  --num:"Press Start 2P","Silkscreen","Courier New",monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --void:#F2F4F9; --panel:#FFFFFF; --signal-hot:#0B4FBC; --ember:#C6D3E8;
  --bone:#131C30; --ash:#5A6579; --grid:rgba(0,61,166,.09);
  --teal:#0E9E93; --teal-deep:#0A6F67; --teal-ink:#ffffff; --sel:#4E92DE;
  --glass-bg:rgba(255,255,255,.62); --glass-brd:rgba(14,158,147,.5); --glass-hi:rgba(255,255,255,.85);
  --glass-shadow:0 6px 24px rgba(10,22,48,.12);
  --bar:rgba(247,249,253,.8); --field:rgba(255,255,255,.75); --line:rgba(0,61,166,.14);
  --glow1:#BBD5FA; --glow2:#F2F4F9;
  --menu:#F7F9FD;
  --hero1:#9EC2F5; --hero2:#BBD5FA; --hero3:#DCEAFD; --hero4:#F7EBD9;
  --moon-top:-24%; --moon-right:6%; --moon-op:0; --sun-top:9%; --sun-right:12%; --sun-op:1;
  --gold-t:rgba(201,148,18,.2); --silver-t:rgba(124,135,152,.2); --bronze-t:rgba(176,106,44,.2);
  --sk-body:#8CA6CE; --sk-lit:#FFE0A8;
  --gold:#C99412; --silver:#7C8798; --bronze:#B06A2C; --ok:#0E9E93; --bad:#D64545;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--void)}
body{min-height:100vh;color:var(--bone);font-family:var(--mono);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background:var(--hero1);transition:color .3s}
/* the sky behind every screen: the home page's gradient, stars and moon (dark), sun and clouds (light) */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(var(--hero1) 0%,var(--hero2) 45%,var(--hero3) 78%,var(--hero4) 100%)}
.sky::after{content:"";position:absolute;inset:0;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px}
.stars{position:absolute;inset:0;transition:opacity .9s ease}
.stars i{position:absolute;width:3px;height:3px;background:var(--bone);opacity:.7;animation:tw 5s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
:root[data-theme="light"] .stars{opacity:0}
.stars b.shoot{position:absolute;width:76px;height:2px;opacity:0;transform-origin:0 50%;
  background:linear-gradient(90deg,transparent,var(--bone));animation:shoot .95s ease-out forwards}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(20deg)}12%{opacity:.95}100%{opacity:0;transform:translate(260px,95px) rotate(20deg)}}
.moon,.sun{position:absolute;width:clamp(52px,7vw,104px);aspect-ratio:1;transition:top 1.2s cubic-bezier(.4,0,.2,1),opacity 1.2s ease,right 1.2s ease;
  clip-path:polygon(30% 0,70% 0,70% 10%,90% 10%,90% 30%,100% 30%,100% 70%,90% 70%,90% 90%,70% 90%,70% 100%,30% 100%,30% 90%,10% 90%,10% 70%,0 70%,0 30%,10% 30%,10% 10%,30% 10%)}
.moon{top:var(--moon-top);right:var(--moon-right);opacity:var(--moon-op);background:#CFE0FF;box-shadow:0 0 60px 10px rgba(77,139,255,.35)}
.sun{top:var(--sun-top);right:var(--sun-right);opacity:var(--sun-op);background:#FFDFA6;box-shadow:0 0 70px 18px rgba(255,196,120,.55)}
.cloud{position:absolute;left:0;opacity:0;background:rgba(255,255,255,.9);transition:opacity 1.2s ease;animation:drift linear infinite;
  clip-path:polygon(0 100%,0 62%,12% 62%,12% 40%,28% 40%,28% 18%,50% 18%,50% 0,72% 0,72% 22%,88% 22%,88% 50%,100% 50%,100% 100%)}
:root[data-theme="light"] .cloud{opacity:.8}
.cloud.c1{top:13%;width:170px;height:56px;animation-duration:120s;animation-delay:-30s}
.cloud.c2{top:27%;width:112px;height:38px;animation-duration:170s;animation-delay:-100s}
.cloud.c3{top:6%;width:220px;height:70px;animation-duration:210s;animation-delay:-60s}
@keyframes drift{from{transform:translateX(-26vw)}to{transform:translateX(126vw)}}
::selection{background:var(--teal);color:var(--teal-ink)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
[hidden]{display:none!important}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
.px{font-family:var(--px);font-weight:400;letter-spacing:.05em}
.num{font-family:var(--num)}
.muted{color:var(--ash)}

/* glass, as on the main site */
.glass{position:relative;background:var(--glass-bg);border:1px solid var(--glass-brd);
  backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.2rem;
  font-family:var(--px);font-size:.74rem;letter-spacing:.06em;color:var(--bone);text-decoration:none;white-space:nowrap;
  background:var(--glass-bg);border:1px solid var(--glass-brd);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .2s,background .2s,color .2s,transform .15s}
.btn:hover{border-color:var(--teal)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:.5rem .8rem;font-size:.64rem}
.btn:disabled{opacity:.45;cursor:default;transform:none}
input.field,select.field,textarea.field{width:100%;padding:.8rem .9rem;background:var(--field);border:1px solid var(--glass-brd);outline:none;transition:border-color .2s,box-shadow .2s}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(25,211,197,.18)}
label.lbl{display:block;margin:1rem 0 .4rem;font-family:var(--px);font-size:.66rem;letter-spacing:.08em;color:var(--teal)}

/* skyline along the bottom of every screen: the same artwork as the site's hero and footer */
.skyline{position:fixed;left:0;right:0;bottom:0;z-index:0;pointer-events:none;line-height:0;opacity:.9}
.skyline svg{width:100%;height:auto;aspect-ratio:4/1;display:block;max-height:34vh}
.skyline::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--void) 100%);z-index:1}
.sk-body{fill:var(--sk-body)}
.sk-lit{fill:var(--sk-lit);opacity:.85}
#vLogin,#vApp{position:relative;z-index:1}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem 6rem}
.lbox{width:min(380px,100%);padding:2.2rem 1.6rem 1.8rem;animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards}
.lbox{overflow:hidden}
.lbox::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--signal),var(--teal),var(--signal))}
/* a slow sheen across the card */
.lbox::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.07) 50%,transparent 58%);
  background-size:260% 100%;animation:sheen 7s ease-in-out 1.2s infinite}
@keyframes sheen{0%{background-position:130% 0}45%,100%{background-position:-30% 0}}
.lbox > *{position:relative;z-index:1}
/* signing in: a bar runs along the bottom of the button */
#bIn{position:relative;overflow:hidden}
#bIn.busy:disabled{opacity:1}
#bIn.busy::after{content:"";position:absolute;left:-40%;bottom:0;width:40%;height:3px;background:var(--teal-ink);animation:busy 1s linear infinite}
@keyframes busy{to{left:100%}}
.lbox .logo{filter:drop-shadow(0 0 22px rgba(25,211,197,.22));transition:transform .3s}
.lbox a:hover .logo{transform:translateY(-2px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.lbox .logo{display:block;width:min(200px,64%);height:auto;margin:0 auto 1rem}
.pwwrap{position:relative}
.pwwrap .field{padding-right:4.6rem}
.pweye{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);padding:.35rem .55rem;font-family:var(--px);font-size:.6rem;
  letter-spacing:.06em;background:none;border:1px solid var(--line);color:var(--ash)}
.pweye:hover{color:var(--teal);border-color:var(--teal)}
.lbox .btn.primary{width:100%;margin-top:1.3rem;padding:.95rem}
.err{min-height:1.3em;margin-top:.8rem;font-size:.85rem;color:var(--bad);text-align:center}

/* ---------- TOP BAR ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bar);border-bottom:1px solid var(--glass-brd);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
.top .wrap{display:flex;align-items:center;gap:1rem;padding:.65rem 0}
.top .crest{display:flex;align-items:center;gap:.8rem;text-decoration:none;color:inherit}
.top .crest img{height:38px;width:auto}
:root:not([data-theme="light"]) .logo-day{display:none}
:root[data-theme="light"] .logo-night{display:none}
.top .app{padding-left:.8rem;border-left:1px solid var(--line);font-family:var(--px);font-size:.82rem;letter-spacing:.08em;line-height:1.15}
.top .app b{display:block;font-weight:400;color:var(--teal)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:.7rem}
.who{text-align:right;font-size:.78rem;line-height:1.3}
.who b{display:block;font-family:var(--px);font-weight:400;font-size:.72rem;letter-spacing:.05em;color:var(--signal-hot)}
.who span{color:var(--ash)}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .6rem;font-family:var(--px);font-size:.58rem;letter-spacing:.07em;
  border:1px solid var(--line);color:var(--ash);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.off i{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.pill.off{color:var(--gold)}
.themetog{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;padding:0;color:var(--teal);font-size:.95rem;
  background:var(--glass-bg);border:1px solid var(--glass-brd);transition:transform .2s,border-color .2s}
.themetog:hover{border-color:var(--teal);transform:rotate(-18deg)}
/* phones: one slim row (crest, title, menu); the rest opens as a panel under the bar */
.menubtn{display:none;position:relative;margin-left:auto;width:42px;height:38px;padding:0;background:var(--glass-bg);border:1px solid var(--glass-brd);
  flex-direction:column;align-items:center;justify-content:center;gap:4px}
.menubtn i{display:block;width:18px;height:2px;background:var(--teal);transition:transform .3s,opacity .2s}
.top.open .menubtn i:nth-child(1){transform:translateY(6px) rotate(45deg)}
.top.open .menubtn i:nth-child(2){opacity:0}
.top.open .menubtn i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
/* offline shows even with the menu shut */
.top.off .menubtn::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
@media (max-width:760px){
  .top .wrap{gap:.7rem}
  .top .crest img{height:28px}
  .top .app{font-size:.68rem}
  .menubtn{display:flex}
  .top .right{position:absolute;top:calc(100% + 1px);right:0;left:0;margin:0;padding:1rem;flex-direction:column;align-items:stretch;gap:.8rem;
    background:var(--menu);border-bottom:1px solid var(--glass-brd);box-shadow:0 18px 40px rgba(0,0,0,.35);   /* near-solid: the bar's own blur stops a second blur working here */
    opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s,transform .25s,visibility 0s .25s}
  .top.open .right{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s}
  .who{text-align:left}
  .top .right .pill{align-self:flex-start}
  .top .right .themetog{align-self:flex-start}
  .top .right #bOut{width:100%}
}

/* ---------- SHARED LAYOUT ---------- */
main{padding:1.6rem 0 11rem}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.4rem;flex-wrap:wrap;margin:.6rem 0 1.6rem}
.kicker{font-family:var(--px);font-size:.66rem;letter-spacing:.1em;color:var(--teal)}
.hero h2{margin:.4rem 0 0;font-family:var(--px);font-weight:700;font-size:clamp(1.7rem,4.6vw,2.5rem);line-height:1;color:var(--bone);
  text-shadow:4px 4px 0 var(--ember)}
.hero p{max-width:62ch;font-size:.9rem;color:var(--ash)}
.banner{padding:.85rem 1.1rem;margin-bottom:1rem;font-size:.88rem;border-left:3px solid var(--line);background:rgba(77,139,255,.06)}
.banner.ok{border-color:var(--teal);background:rgba(25,211,197,.09)}
.banner.warn{border-color:var(--gold);background:rgba(255,211,107,.08)}
.banner.bad{border-color:var(--bad);background:rgba(255,107,107,.08)}
.banner .btn{margin-left:.6rem}
.banner.bar-row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.empty{padding:2.4rem 1rem;text-align:center;color:var(--ash)}
.note{font-size:.8rem;color:var(--ash)}

/* progress box on the judge screen */
.prog{min-width:min(260px,100%);padding:.9rem 1.1rem}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:.8rem;color:var(--ash)}
.prog .row b{font-family:var(--num);font-weight:400;font-size:.95rem;color:var(--teal)}
.track{height:5px;margin:.6rem 0 0;background:rgba(127,127,127,.18)}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--signal),var(--teal));transition:width .4s}

/* scoring guide */
details.guide{margin-bottom:1.2rem}
details.guide summary{list-style:none;cursor:pointer;padding:.85rem 1.1rem;font-family:var(--px);font-size:.72rem;letter-spacing:.07em;color:var(--teal);
  display:flex;justify-content:space-between;align-items:center}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"+";font-size:1.1rem;transition:transform .3s}
details.guide[open] summary::after{transform:rotate(45deg)}
.rub{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.8rem;padding:0 1.1rem 1.1rem}
.rub div{padding:.8rem .9rem;background:var(--field);border-left:2px solid var(--teal)}
.rub small{display:block;font-family:var(--px);font-size:.58rem;letter-spacing:.07em;color:var(--ash)}
.rub b{display:block;margin:.2rem 0 .3rem;font-size:.92rem}
.rub .grp{grid-column:1/-1;margin-top:.3rem;font-family:var(--px);font-size:.62rem;letter-spacing:.1em;color:var(--teal)}
.lvl{list-style:none;margin-top:.5rem;font-size:.78rem;line-height:1.4;color:var(--ash)}
.lvl li{display:grid;grid-template-columns:1.4rem 1fr;gap:.3rem;padding:.2rem 0}
.lvl li b{display:block;margin:0;font-family:var(--num);font-size:.62rem;color:var(--teal)}
.rub p{font-size:.8rem;color:var(--ash);line-height:1.45}

/* ---------- JUDGE: one card per team ---------- */
.teams{display:grid;gap:1rem}
.team{padding:1.1rem 1.1rem 1rem;border-left-width:4px;border-left-color:var(--ember);transition:border-color .3s}
.team.scored{border-left-color:var(--teal)}
.team.scored .tot b{color:var(--teal);text-shadow:0 0 14px rgba(25,211,197,.35)}
.teams .team{animation:rise .45s ease-out backwards}
.team .th{display:flex;gap:1rem;align-items:center;margin:-1.1rem -1.1rem .9rem;padding:1rem 1.1rem;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(25,211,197,.07),transparent 70%);transition:background .4s}
.team.scored .th{background:linear-gradient(90deg,rgba(25,211,197,.17),transparent 75%)}
.ringw{position:relative;width:54px;height:54px;display:grid;place-items:center;margin-left:auto}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.6}
.ring .rb{stroke:var(--line)}
.ring .rf{stroke:var(--teal);transition:stroke-dasharray .45s cubic-bezier(.2,.7,.2,1)}
.team.scored .ring .rf{filter:drop-shadow(0 0 3px var(--teal))}
.team .no{font-family:var(--px);font-size:.75rem;letter-spacing:.06em;color:var(--teal);padding:.35rem .5rem;border:1px solid var(--glass-brd);white-space:nowrap}
.team .nm{flex:1;min-width:0}
.team .nm b{display:block;font-size:1.02rem}
.team .nm div{font-size:.8rem;color:var(--ash)}
.team .tot{text-align:center;white-space:nowrap}
.team .tot b{position:relative;font-family:var(--num);font-weight:400;font-size:.82rem}
.team .tot span{display:block;margin-top:.2rem;font-size:.68rem;color:var(--ash)}
.grp.sm{margin:1rem 0 .1rem;font-family:var(--px);font-size:.62rem;letter-spacing:.1em;color:var(--teal)}
.cr{display:grid;grid-template-columns:minmax(150px,1fr) 3fr;gap:.4rem 1rem;align-items:center;padding:.55rem 0;border-top:1px dashed var(--line)}
.cr label{font-size:.85rem}
.cr label small{display:block;font-size:.7rem;color:var(--ash)}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:.3rem}
.lv button{height:40px;font-family:var(--num);font-size:.68rem;background:var(--field);border:1px solid var(--line);transition:background .15s,border-color .15s,color .15s}
.lv button:hover:not(:disabled){border-color:var(--teal)}
.lv button.on{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);box-shadow:0 0 16px rgba(25,211,197,.4)}
.lv button:active:not(:disabled){transform:scale(.94)}
.lv button:disabled{cursor:default}
.cr input.field{max-width:9rem;font-family:var(--num);font-size:.85rem}
.cr input.badv{border-color:var(--bad)}
.team .st{margin-top:.5rem;font-family:var(--px);font-size:.6rem;letter-spacing:.07em;color:var(--ash)}
.team .st.ok{color:var(--teal)}
.team .st.err{color:var(--bad)}
@keyframes pop{40%{transform:scale(1.16)}100%{transform:scale(1)}}
.lv button.pop{animation:pop .3s cubic-bezier(.2,.7,.2,1)}
@media (max-width:640px){ .cr{grid-template-columns:1fr} .lv{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:.4rem} .lv button{height:48px;font-size:.74rem} }

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);border-top:1px solid var(--glass-brd);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:.8rem 0 calc(.8rem + env(safe-area-inset-bottom))}
.dock .wrap{display:flex;align-items:center;gap:1rem;justify-content:space-between}
.dock::before{content:"";position:absolute;left:0;top:-1px;height:3px;width:var(--p,0%);background:linear-gradient(90deg,var(--signal),var(--teal));
  box-shadow:0 0 12px var(--teal);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.dock{transition:background .5s,box-shadow .5s}
.dock.ready{background:linear-gradient(90deg,rgba(25,211,197,.2),var(--bar) 65%);box-shadow:0 -10px 34px rgba(25,211,197,.14)}
.dock.ready .btn.primary{box-shadow:0 0 24px rgba(25,211,197,.5)}
.dock.ready .note{color:var(--teal)}
.dock .note{margin:0}

/* ---------- RESULTS ---------- */
.tabs{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1.3rem}
.tab{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem .85rem;font-family:var(--px);font-size:.66rem;letter-spacing:.05em;
  background:var(--glass-bg);border:1px solid var(--line);color:var(--bone);transition:border-color .2s,background .2s}
.tab:hover{border-color:var(--teal)}
.tab[aria-selected="true"]{border-color:var(--teal);background:rgba(25,211,197,.13)}
.tab.tool{border-style:dashed}
.jst{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .6rem;font-family:var(--px);font-size:.58rem;letter-spacing:.06em;
  border:1px solid var(--line);color:var(--ash);white-space:nowrap}
.chip.done{border-color:var(--teal);color:var(--teal)}
.chip.final{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
em.chip{font-style:normal;margin-left:.5rem;padding:.2rem .4rem;font-size:.5rem}
.chip.tie{border-color:var(--gold);color:var(--gold)}

.tiebar{margin:.2rem 0 .8rem;font-size:.82rem;color:var(--gold)}
.tscroll{overflow-x:auto;margin-bottom:1rem}
table.res{width:100%;border-collapse:collapse;font-size:.86rem}
.res th,.res td{padding:.7rem .75rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.res th{font-family:var(--px);font-weight:400;font-size:.6rem;letter-spacing:.07em;color:var(--teal);white-space:nowrap;background:rgba(127,127,127,.06)}
.res td.n,.res th.n{text-align:right;white-space:nowrap}
.res td.big{font-family:var(--num);font-size:.8rem;white-space:nowrap}
.res tr.r1 td.big:first-child{color:var(--gold)} .res tr.r2 td.big:first-child{color:var(--silver)} .res tr.r3 td.big:first-child{color:var(--bronze)}
.res .s{font-size:.76rem;color:var(--ash)}
@media (max-width:760px){ .hide-m{display:none} }

/* results: one drop-down per event */
.ev{margin-bottom:.8rem}
.ev summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.9rem;padding:1rem 1.1rem}
.ev summary::-webkit-details-marker{display:none}
.ev summary::after{content:"+";font-size:1.2rem;color:var(--teal);transition:transform .3s}
.ev[open] summary::after{transform:rotate(45deg)}
.ev .en{flex:1;font-family:var(--px);font-size:.95rem;letter-spacing:.05em}
.ev .body{padding:0 1.1rem .6rem}
.troph{padding:1.1rem 1.1rem .3rem;margin-top:1.6rem;transition:border-color .4s,box-shadow .4s}
.troph.won{border-color:var(--gold);box-shadow:var(--glass-shadow),0 0 46px rgba(255,211,107,.16)}
.troph.won .lead{font-size:clamp(1.4rem,4.4vw,2.1rem);text-shadow:0 0 22px rgba(255,211,107,.35)}
.ev.done{border-left:3px solid var(--teal)}
.ev[open]{border-color:var(--teal)}
.evbar{margin:-.4rem 0 .9rem}
/* podium: 2nd, 1st, 3rd */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;align-items:end;margin:.6rem 0 1.2rem;border-bottom:2px solid var(--line)}
.pod{display:flex;flex-direction:column;justify-content:flex-end;text-align:center;min-width:0}
.pod .pw{padding:0 .25rem .6rem}
.pod .pw b{display:block;font-size:.9rem;line-height:1.25;overflow-wrap:anywhere}
.pod .pw b + span{display:block;margin-top:.15rem}
.pod .pw span{font-size:.72rem;color:var(--ash)}
.pod .pw em{display:block;margin:.35rem 0 .5rem;font-style:normal;font-family:var(--num);font-size:.8rem}
.pod .blk{display:grid;place-items:center;border:1px solid;border-bottom:none}
.pod .blk i{font-style:normal;font-family:var(--num);font-size:.8rem}
.pod.p1 .blk{height:96px;border-color:var(--gold);background:linear-gradient(180deg,var(--gold-t),transparent)}
.pod.p2 .blk{height:68px;border-color:var(--silver);background:linear-gradient(180deg,var(--silver-t),transparent)}
.pod.p3 .blk{height:48px;border-color:var(--bronze);background:linear-gradient(180deg,var(--bronze-t),transparent)}
.pod.p1 .blk i,.pod.p1 .pw em{color:var(--gold)} .pod.p2 .blk i,.pod.p2 .pw em{color:var(--silver)} .pod.p3 .blk i,.pod.p3 .pw em{color:var(--bronze)}
.rank .podium{margin:.4rem 0 .6rem}
@media (max-width:480px){ .pod .pw b{font-size:.78rem} .pod .pw span{font-size:.66rem} .pod .blk i{font-size:.66rem} }
.troph .sec{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.lead{margin:.8rem 0 1rem;font-family:var(--px);font-weight:400;font-size:1.3rem;line-height:1.2;color:var(--gold)}
.lead small{display:block;margin-top:.35rem;font-size:.58rem;letter-spacing:.1em;color:var(--ash)}
.cert h3{margin:1.4rem 0 .6rem;font-family:var(--px);font-weight:400;font-size:.8rem;letter-spacing:.07em;color:var(--teal)}
.cert h3 .num{font-size:.62rem;color:var(--ash);margin-left:.6rem}

/* judge: ranking */
.rank{padding:1.1rem 1.1rem .6rem;margin-top:1rem}
.rank h3{margin-bottom:.4rem;font-family:var(--px);font-weight:400;font-size:.8rem;letter-spacing:.07em;color:var(--teal)}
.rk{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:.8rem;align-items:center;padding:.75rem 0;border-top:1px dashed var(--line)}
.rk .pos{font-family:var(--num);font-size:.7rem;color:var(--ash)}
.rk .nm b{display:block;font-size:.95rem}
.rk .nm div{font-size:.78rem;color:var(--ash)}
.rk .pts{font-family:var(--num);font-size:.95rem;text-align:right;white-space:nowrap}
.rk.done{grid-template-columns:3.2rem 1fr}
.rk{transition:background .25s}
.rk.pick1{background:linear-gradient(90deg,var(--gold-t),transparent 70%);box-shadow:inset 3px 0 0 var(--gold)}
.rk.pick2{background:linear-gradient(90deg,var(--silver-t),transparent 70%);box-shadow:inset 3px 0 0 var(--silver)}
.rk.pick3{background:linear-gradient(90deg,var(--bronze-t),transparent 70%);box-shadow:inset 3px 0 0 var(--bronze)}
.rk .pos{padding-left:.5rem}
.rk.done .pos{color:var(--teal)}
.pk{display:flex;gap:.3rem}
.pk button{min-width:48px;height:40px;padding:0 .5rem;font-family:var(--px);font-size:.6rem;letter-spacing:.04em;background:var(--field);border:1px solid var(--line);transition:background .15s,border-color .15s}
.pk button:hover{border-color:var(--teal)}
.pk button.on.p1{background:var(--gold);border-color:var(--gold);color:#1a1200}
.pk button.on.p2{background:var(--silver);border-color:var(--silver);color:#10151f}
.pk button.on.p3{background:var(--bronze);border-color:var(--bronze);color:#1c0e00}
@media (max-width:640px){ .rk{grid-template-columns:1.6rem 1fr auto} .rk .pk{grid-column:1/-1} .pk button{flex:1} }

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;align-items:end;padding:1.1rem;margin-bottom:1.2rem}
.form-grid label.lbl{margin-top:0}
.msg{grid-column:1/-1;font-size:.86rem}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}

@media print{
  .top,.dock,.skyline,.tabs,.btn,.banner .btn{display:none!important}
  body{background:#fff;color:#000}
  .glass{background:none;box-shadow:none;border-color:#999;backdrop-filter:none}
  main{padding:0}
}
/* theme switch: the same cross-fade timing as index.html */
.theme-vt::view-transition-old(root),.theme-vt::view-transition-new(root){animation-duration:.55s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
/* screens fade and rise in */
.swap > *{animation:rise .42s cubic-bezier(.2,.7,.2,1) backwards}   /* backwards, not both: a held end state would cut the glass blur off from the sky */
.swap > :nth-child(2){animation-delay:.04s} .swap > :nth-child(3){animation-delay:.08s} .swap > :nth-child(n+4){animation-delay:.12s}
.ev.opening .body{animation:rise .38s cubic-bezier(.2,.7,.2,1) backwards}
@media (max-width:560px){ .ev summary{flex-wrap:wrap;row-gap:.55rem} .ev .en{flex-basis:100%} .ev summary::after{margin-left:auto} }
/* loading: shimmering placeholder cards */
.skel{display:grid;gap:1rem;padding-top:.6rem}
.skel i{display:block;height:88px;border:1px solid var(--line);
  background:linear-gradient(100deg,var(--glass-bg) 30%,var(--glass-hi) 50%,var(--glass-bg) 70%) 0 0/300% 100%;animation:shim 1.4s linear infinite}
.skel i:first-child{height:54px;width:60%}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
/* director tabs: one bar, an underline slides to the open tab */
.tabs.seg{position:relative;gap:0;flex-wrap:nowrap;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs.seg::-webkit-scrollbar{display:none}
.seg .tab{background:none;border:none;padding:.85rem 1.05rem;color:var(--ash);white-space:nowrap;transition:color .25s}
.seg .tab:hover{color:var(--bone);border:none}
.seg .tab[aria-selected="true"]{color:var(--teal);background:none}
.seg .ind{position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--teal);box-shadow:0 0 10px var(--teal);
  transition:left .38s cubic-bezier(.2,.7,.2,1),width .38s cubic-bezier(.2,.7,.2,1)}
.seg.mini{display:inline-flex;margin-bottom:1rem}
.seg.mini .tab{padding:.6rem .9rem}
.seg.mini .tab[aria-selected="true"]{box-shadow:inset 0 -2px 0 var(--teal)}
/* live: a pulsing dot on events being judged; changed numbers flash */
.live{display:inline-block;width:8px;height:8px;margin-right:.6rem;border-radius:50%;background:var(--teal);vertical-align:middle;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(25,211,197,.6)}100%{box-shadow:0 0 0 10px rgba(25,211,197,0)}}
.bump{animation:bump 1s ease-out}
@keyframes bump{0%{color:var(--teal);text-shadow:0 0 12px var(--teal)}100%{text-shadow:none}}
/* light mode: medal colours readable on pale backgrounds */
:root[data-theme="light"] .pk button.on{color:#fff}
:root[data-theme="light"] .moon{box-shadow:none}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

/* ---------------- scoring maths ---------------- */
// the judge's total for one team, or null until every required criterion has a mark
const total = s => { if (!s) return null; const R = RUB[s.event]; if (!R) return null; let t = 0;
  for (let i = 0; i < R.length; i++) { const v = s['c' + (i + 1)]; if (Number.isInteger(v)) t += v; else if (!R[i].opt) return null; } return t; };
const time = t => { const d = t?.toDate ? t.toDate() : t ? new Date(t) : null; return d ? d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : ''; };
const ordn = n => ['1st', '2nd', '3rd'][n - 1];

const podium = (rows, score) => { const cell = p => { const L = rows.filter(r => r.place === p);
  return `<div class="pod p${p}"><div class="pw">${L.length ? L.map(r => `<b>${esc(r.team)}</b><span>${esc(subOf(r))}</span>${score && score(r) != null ? `<em>${score(r)}</em>` : ''}`).join('') : '<span>–</span>'}</div>
    <div class="blk"><i>${ordn(p).toUpperCase()}</i></div></div>`; };
  return `<div class="podium">${cell(2)}${cell(1)}${cell(3)}</div>`; };

// everything the results, admin and director screens show, worked out from the raw records.
// A team's score is the average of its judges' totals. The order is that score, then the event's tie-break groups,
// then the judges' own 1st/2nd/3rd picks (3, 2, 1 points each). A tie that survives all of that is flagged.
function model(scores, status) {
  const lex = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
  const evs = EVENTS.map(E => {
    const J = JUDGES_OF[E.id], sts = J.map(j => status.find(x => x.id === j) || {});
    const submitted = sts.filter(x => x.final).length, final = E.manual ? !!(status.find(x => x.id === 'pod_' + E.id) || {}).p1 : submitted === J.length;
    const order = (status.find(x => x.id === 'tb_' + E.id) || {}).order || [], dv = no => { const k = order.indexOf(no); return k < 0 ? 99 : k; };
    const pod = E.manual ? (status.find(x => x.id === 'pod_' + E.id) || {}) : null;
    const borda = {}; if (pod) [pod.p1, pod.p2, pod.p3].forEach((no, k) => { if (no) borda[no] = 3 - k; });
    sts.forEach(x => [x.p1, x.p2, x.p3].forEach((no, k) => { if (no) borda[no] = (borda[no] || 0) + 3 - k; }));
    const rows = E.teams.map(t => {
      const per = J.map(j => { const s = scores.find(x => x.judge === j && x.no === t.no); return { j, s, T: total(s) }; });
      const got = per.filter(p => p.T !== null);
      const T = got.length ? Math.round(10 * got.reduce((a, p) => a + p.T, 0) / got.length) / 10 : null;
      const tbv = (E.tb || []).map(g => got.length ? got.reduce((a, p) => a + g.reduce((x, n) => x + (Number.isInteger(p.s['c' + n]) ? p.s['c' + n] : 0), 0), 0) / got.length : 0);
      return { ...t, per, T, tbv, borda: borda[t.no] || 0, full: got.length === J.length, place: 0, tie: false };
    });
    rows.sort((a, b) => (b.T ?? -1) - (a.T ?? -1) || lex(b.tbv, a.tbv) || b.borda - a.borda || dv(a.no) - dv(b.no) || a.no.localeCompare(b.no));
    if (final) { let pl = 0; rows.forEach((r, i) => { const p = rows[i - 1];
      const same = p && r.T !== null && r.T === p.T && lex(r.tbv, p.tbv) === 0 && r.borda === p.borda && dv(r.no) === dv(p.no);
      if (!same) pl = i + 1; r.place = pl <= 3 ? pl : 0; if (same && pl <= 3) { r.tie = true; p.tie = true; } }); }
    const judges = J.map((j, k) => ({ id: j, final: !!sts[k].final, entered: rows.filter(r => r.per[k].T !== null).length, started: rows.some(r => r.per[k].s) }));
    return { E, judges, final, submitted, pod, decided: order.length > 0, entered: rows.filter(r => r.full).length, started: judges.some(j => j.started), rows };
  });

}
// school standings for the rolling trophy: every team's points added up across every event.
// finalOnly counts judged events only; otherwise whatever has been scored so far.
function schools(m, finalOnly) {
  const map = new Map();
  Object.values(TEAMS).forEach(t => { if (!map.has(norm(t.school))) map.set(norm(t.school), { school: t.school, total: 0, by: {} }); });
  m.evs.forEach(e => { if (e.E.manual || (finalOnly && !e.final)) return;
    e.rows.forEach(r => { if (r.T === null) return; const x = map.get(norm(r.school));
      const pts = TROPHY_BASIS === 'percent' ? Math.round(1000 * r.T / EMAX(e.E.id)) / 10 : r.T;
      x.total = Math.round(10 * (x.total + pts)) / 10; x.by[e.E.id] = Math.round(10 * ((x.by[e.E.id] || 0) + pts)) / 10; }); });
  const L = [...map.values()].sort((a, b) => b.total - a.total || a.school.localeCompare(b.school));
  let r = 0; L.forEach((x, i) => { if (i === 0 || x.total !== L[i - 1].total) r = i + 1; x.rank = r; });
  return L;
}

/* ---------------- JUDGE ----------------

          ${C.map((c, i) => `${grp(C, i, true)}<div class="cr"><label>${esc(c.n)}<small>${cmin(c) ? cmin(c) + ' to ' : '/ '}${cmax(c)}${c.opt ? ' · optional' : ''}</small></label>${control(t, c, i)}</div>`).join('')}

/* ---------------- RESULTS / ADMIN / DIRECTOR ----------------

    <div class="hero"><div><span class="kicker">${isDir ? 'DIRECTOR' : isHead ? 'EVENT HEAD' : kind === 'admin' ? 'LIVE' : 'BYTEFEST 2026'}</span>
      <h2>${isDir ? 'Control' : isHead ? esc(R.name) : kind === 'admin' ? 'Live scores' : 'Results'}</h2></div></div>
    <div class="tabs" role="tablist" id="tabs"></div><div id="pane">${SKEL}</div>`;
  swapIn($('#main'));
  $('#pane').addEventListener('toggle', e => { const d = e.target; if (!d.dataset || !d.dataset.id) return;
    if (d.open) { open.add(d.dataset.id); if (!reduceM) { d.classList.add('opening'); setTimeout(() => d.classList.remove('opening'), 450); } } else open.delete(d.dataset.id); }, true);
  const where = r => esc(subOf(r));

  function resultsHTML(m) {
    // the results logins see only the winner, and only once every event is judged; admin and director see the standings
    const winnerOnly = kind === 'results';
    const L = schools(m, true), done = m.judged === EVENTS.length, lead = L.filter(x => x.rank === 1 && x.total > 0);
    const evs = m.evs.map(e => { const E = e.E;
      const multi = e.judges.length > 1, tied = e.rows.some(r => r.tie);
      if (E.manual) {
        const pod = e.pod || {}, dr = podDraft[E.id] || (podDraft[E.id] = { 1: pod.p1 || '', 2: pod.p2 || '', 3: pod.p3 || '' });
        const sel = p => `<div><label class="lbl" for="pod${E.id}${p}">${ordn(p).toUpperCase()}</label><select class="field" id="pod${E.id}${p}" data-pod="${E.id}|${p}"><option value="">Choose…</option>
          ${E.teams.map(t => `<option value="${esc(t.no)}"${dr[p] === t.no ? ' selected' : ''}>${esc(t.team)} (${esc(t.no)})${t.team === t.school ? '' : ' · ' + esc(t.school)}</option>`).join('')}</select></div>`;
        const form = kind === 'director' ? `<div class="form-grid glass">${[1, 2, 3].slice(0, Math.min(3, E.teams.length)).map(sel).join('')}
          <button class="btn primary" type="button" data-savepod="${E.id}">Save placings</button></div>` : '';
        const table = e.final ? `${podium(e.rows)}<div class="tscroll"><table class="res"><thead><tr><th>Place</th><th>Team</th></tr></thead><tbody>
          ${e.rows.filter(r => r.place).map(r => `<tr class="r${r.place}"><td class="big">${ordn(r.place).toUpperCase()}</td><td><b>${esc(r.team)}</b><div class="s">${where(r)}</div><div class="s">${esc(r.members)}</div></td></tr>`).join('')}</tbody></table></div>`
          : (kind === 'director' ? '' : '<p class="note" style="padding:.2rem 0 .5rem">Not decided yet.</p>');
        return `<details class="ev glass${e.final ? ' done' : ''}" data-id="${E.id}" ${open.has(E.id) ? 'open' : ''}><summary><span class="en">${esc(E.name)}</span>${E.example ? '<span class="chip">EXAMPLE TEAMS</span>' : ''}
          <span class="chip ${e.final ? 'final' : ''}">${e.final ? 'DECIDED' : 'PENDING'}</span></summary><div class="body">${form}${table}</div></details>`;
      }
      const body = !e.final ? '<p class="note" style="padding:.2rem 0 .5rem">Not judged yet.</p>'
        : `${tied ? `<p class="tiebar">Teams marked TIE are level on everything, including the judges’ rankings. ${kind === 'director' ? 'Choose who goes first.' : 'The director decides these.'}</p>` : ''}
          ${kind === 'director' && e.decided ? `<p class="tiebar"><button class="btn small" type="button" data-cleartb="${E.id}">Undo tie decision</button></p>` : ''}
          ${podium(e.rows, r => r.T)}<div class="tscroll"><table class="res"><thead><tr><th>Place</th><th>Team</th><th class="n">${multi ? 'Average' : 'Score'} / ${EMAX(E.id)}</th></tr></thead><tbody>
            ${e.rows.map(r => `<tr class="${r.place ? 'r' + r.place : ''}"><td class="big">${r.place ? ordn(r.place).toUpperCase() : '–'}${r.tie ? '<em class="chip tie">TIE</em>' : ''}</td>
              <td><b>${esc(r.team)}</b><div class="s">${where(r)}</div><div class="s">${esc(r.members)}</div>${kind === 'director' && r.tie ? `<button class="btn small" type="button" style="margin-top:.5rem" data-first="${E.id}|${esc(r.no)}">Place first</button>` : ''}</td><td class="n big">${r.T ?? '–'}</td></tr>`).join('')}</tbody></table></div>`;
      return `<details class="ev glass${e.final ? ' done' : ''}" data-id="${E.id}" ${open.has(E.id) ? 'open' : ''}><summary><span class="en">${esc(E.name)}</span>${E.example ? '<span class="chip">EXAMPLE TEAMS</span>' : ''}
        <span class="chip ${e.final ? 'final' : ''}">${e.final ? 'JUDGED' : 'PENDING' + (multi ? ` · ${e.submitted} OF ${e.judges.length}` : '')}</span></summary><div class="body">${body}</div></details>`; }).join('');
    const trophy = `<section class="troph glass${done && lead.length ? ' won' : ''}"><div class="sec"><span class="kicker">ROLLING TROPHY</span>
        <span class="chip ${done ? 'final' : ''}">${m.judged} OF ${EVENTS.length} EVENTS JUDGED</span></div>
      ${winnerOnly
        ? (done && lead.length ? `<h3 class="lead">${esc(lead.map(x => x.school).join(' & '))}<small>${lead.length > 1 ? 'TIED OVERALL' : 'OVERALL WINNER'}</small></h3>`
          : '<p class="note" style="margin:.8rem 0 1.2rem">Announced once every event is judged.</p>')
        : (lead.length ? `<h3 class="lead">${esc(lead.map(x => x.school).join(' & '))}<small>${done ? (lead.length > 1 ? 'TIED OVERALL' : 'OVERALL WINNER') : 'LEADING SO FAR'}</small></h3>` : '<p class="note" style="margin:.8rem 0">No events judged yet.</p>')
        + schoolTable(L)}</section>`;
    return evs + trophy;
  }
  const schoolTable = L => `<div class="tscroll"><table class="res"><thead><tr><th>#</th><th>School</th>${EVENTS.filter(E => !E.manual).map(E => `<th class="n hide-m">${esc(E.code)}</th>`).join('')}<th class="n">Points</th></tr></thead><tbody>
    ${L.map(x => `<tr class="${x.total && x.rank === 1 ? 'r1' : ''}" data-k="sch|${esc(norm(x.school))}"><td class="big">${x.total ? x.rank : '–'}</td><td><b>${esc(x.school)}</b></td>
      ${EVENTS.filter(E => !E.manual).map(E => `<td class="n hide-m">${x.by[E.id] ?? '–'}</td>`).join('')}<td class="n big" data-c="sch|${esc(norm(x.school))}">${x.total}</td></tr>`).join('')}</tbody></table></div>`;

  function liveHTML(m) {
    const tog = `<div class="tabs seg mini"><button class="tab" type="button" data-mode="event" aria-selected="${mode === 'event'}">By event</button>
      <button class="tab" type="button" data-mode="school" aria-selected="${mode === 'school'}">By school</button></div>`;
    if (isHead || mode === 'event') return (isHead ? '' : tog) + m.evs.filter(e => !isHead || R.evs.includes(e.E.id)).map(e => { const E = e.E, multi = e.judges.length > 1;
      return `<div class="cert"><h3>${!E.manual && e.started && !e.final ? '<span class="live" aria-hidden="true"></span>' : ''}${esc(E.name.toUpperCase())}${E.example ? '<span class="num">EXAMPLE TEAMS</span>' : ''}</h3><div class="jst">${E.manual ? '' : `<span class="chip ${e.entered === E.teams.length ? 'done' : ''}">${e.entered}/${E.teams.length} SCORED</span>`}
        <span class="chip ${e.final ? 'final' : ''}">${E.manual ? (e.final ? 'DECIDED' : 'NOT DECIDED') : e.final ? 'SUBMITTED' : e.started ? `JUDGING${multi ? ` · ${e.submitted} OF ${e.judges.length} SUBMITTED` : ''}` : 'NOT STARTED'}</span></div>
        ${E.manual ? '' : `<div class="track evbar"><i data-bar="${E.id}" style="width:${Math.round(100 * e.judges.reduce((a, j) => a + j.entered, 0) / Math.max(1, E.teams.length * e.judges.length))}%"></i></div>`}
        <div class="tscroll glass"><table class="res"><thead><tr><th>Team</th>${e.judges.map(j => `<th class="n">${esc(ROLE[j.id].label.split(' · ')[0])}</th>`).join('')}${multi ? '<th class="n">Average</th>' : ''}<th>Place</th></tr></thead><tbody>
          ${e.rows.map(r => `<tr class="${r.place ? 'r' + r.place : ''}" data-k="${E.id}|${esc(r.no)}"><td><b>${esc(r.team)}</b><div class="s">${where(r)}</div></td>
            ${r.per.map(p => `<td class="n big" data-c="${E.id}|${esc(r.no)}|${p.j}">${p.T ?? '–'}</td>`).join('')}${multi ? `<td class="n big" data-c="${E.id}|${esc(r.no)}|avg">${r.T ?? '–'}</td>` : ''}
            <td class="big">${r.place ? ordn(r.place).toUpperCase() : '–'}${r.tie ? '<em class="chip tie">TIE</em>' : ''}</td></tr>`).join('')}</tbody></table>${E.manual ? '' : `<div class="s" style="padding:.5rem .8rem">Out of ${EMAX(E.id)}</div>`}</div></div>`; }).join('');
    const L = schools(m, false);
    return tog + `<div class="cert"><h3>STANDINGS<span class="num">${m.judged === EVENTS.length ? 'FINAL' : 'LIVE'}</span></h3><div class="glass" style="padding:.2rem 1rem">${schoolTable(L)}</div></div>`
      + L.map(x => { const k = norm(x.school);
        return `<div class="cert"><h3>${esc(x.school.toUpperCase())}<span class="num">${x.total} PTS</span></h3><div class="tscroll glass"><table class="res"><thead><tr><th>Event</th><th>Team</th><th class="n">Score</th></tr></thead><tbody>
          ${m.evs.flatMap(e => e.rows.filter(r => norm(r.school) === k).map(r => `<tr><td>${esc(e.E.name)}</td><td><b>${esc(r.team)}</b><div class="s">${esc(r.no)}</div></td><td class="n big">${r.T ?? '–'}</td></tr>`)).join('')
            || '<tr><td colspan="3" class="note">No teams</td></tr>'}</tbody></table></div></div>`; }).join('');
  }

  function judgesHTML(m) {
    return `<div class="tscroll glass"><table class="res"><thead><tr><th>Event</th><th>Judge</th><th class="n">Scored</th><th>Status</th><th></th></tr></thead><tbody>
      ${m.evs.flatMap(e => e.judges.map(j => `<tr><td><b>${esc(e.E.name)}</b></td><td>${esc(ROLE[j.id].label.split(' · ')[0])}<div class="s">${esc(j.id)}</div></td>
        <td class="n big">${j.entered}/${e.E.teams.length}</td>
        <td><span class="chip ${j.final ? 'final' : ''}">${j.final ? 'SUBMITTED' : j.started ? 'JUDGING' : 'NOT STARTED'}</span></td>
        <td class="n"><button class="btn small" type="button" data-edit="${j.id}">Edit</button>${j.final ? ` <button class="btn small" type="button" data-unlock="${j.id}">Unlock</button>` : ''}</td></tr>`)).join('')}</tbody></table></div>`;
  }
  function wire() {
    $('#pane').querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; render(); });
    $('#pane').querySelectorAll('[data-pod]').forEach(x => x.onchange = () => { const [ev, p] = x.dataset.pod.split('|'); (podDraft[ev] ||= {})[p] = x.value; });
    $('#pane').querySelectorAll('[data-savepod]').forEach(b => b.onclick = () => { const ev = b.dataset.savepod, E = EV[ev], dr = podDraft[ev] || {}, n = Math.min(3, E.teams.length);
      const picks = [1, 2, 3].slice(0, n).map(p => dr[p] || '');
      if (picks.some(x => !x)) return alert('Choose a team for every place.');
      if (new Set(picks).size < picks.length) return alert('The same team is chosen twice.');
      api.save('status', 'pod_' + ev, { event: ev, p1: picks[0] || '', p2: picks[1] || '', p3: picks[2] || '' }); });
    $('#pane').querySelectorAll('[data-first]').forEach(b => b.onclick = () => { const [ev, no] = b.dataset.first.split('|');
      const e = model(scores, status).evs.find(x => x.E.id === ev), me = e.rows.find(r => r.no === no);
      const group = e.rows.filter(r => r.tie && r.place === me.place).map(r => r.no);
      api.save('status', 'tb_' + ev, { event: ev, order: [no, ...group.filter(x => x !== no)] }); });
    $('#pane').querySelectorAll('[data-cleartb]').forEach(b => b.onclick = () => api.del('status', 'tb_' + b.dataset.cleartb));
    $('#pane').querySelectorAll('[data-unlock]').forEach(b => b.onclick = () => confirm(`Let ${b.dataset.unlock} change their scores again?`) && api.save('status', b.dataset.unlock, { final: false }));
    $('#pane').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const jid = b.dataset.edit; stopAll(); judgeView(EV[ROLE[jid].ev], jid, ROLE[jid], true); scrollTo(0, 0); });
  }
  function placeInd() { const T = $('#tabs'), on = T.querySelector(`[data-t="${tab}"]`), ind = T.querySelector('.ind'); if (!on || !ind) return;
    ind.style.left = on.offsetLeft + 'px'; ind.style.width = on.offsetWidth + 'px'; }
  // live updates: remember where rows and numbers were, then glide rows to their new places and count numbers up
  function snap() { const pos = {}, val = {}, bar = {};
    $('#pane').querySelectorAll('[data-k]').forEach(el => { if (el.offsetParent) pos[el.dataset.k] = el.getBoundingClientRect().top; });
    $('#pane').querySelectorAll('[data-c]').forEach(el => { val[el.dataset.c] = el.textContent; });
    $('#pane').querySelectorAll('[data-bar]').forEach(el => { bar[el.dataset.bar] = el.style.width; });
    return { pos, val, bar }; }
  function settle(b) {
    $('#pane').querySelectorAll('[data-k]').forEach(el => { const o = b.pos[el.dataset.k]; if (o == null || !el.offsetParent) return;
      const d = o - el.getBoundingClientRect().top; if (Math.abs(d) > 2) el.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 480, easing: 'cubic-bezier(.2,.7,.2,1)' }); });
    $('#pane').querySelectorAll('[data-c]').forEach(el => { const o = b.val[el.dataset.c]; if (o == null || o === el.textContent) return;
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      const a = parseFloat(o), z = parseFloat(el.textContent); if (!isNaN(a) && !isNaN(z)) countTo(el, a, z); });
    $('#pane').querySelectorAll('[data-bar]').forEach(el => { const o = b.bar[el.dataset.bar]; if (o && o !== el.style.width) el.animate([{ width: o }, { width: el.style.width }], { duration: 600, easing: 'cubic-bezier(.2,.7,.2,1)' }); });
  }
  // forms (logins, clearing data) keep their own state, so live updates don't redraw over what's being typed
  function render() {
    if (TABS.length) {
      const T = $('#tabs');
      if (!T.dataset.built) {   // built once, so the underline can slide between tabs
        T.dataset.built = '1'; T.classList.add('seg');
        T.innerHTML = TABS.map(([k, l]) => `<button class="tab" type="button" role="tab" data-t="${k}">${l}</button>`).join('') + '<i class="ind" aria-hidden="true"></i>';
        T.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { if (tab === b.dataset.t) return; tab = b.dataset.t; last = ''; $('#pane').innerHTML = ''; render(); });
        document.fonts?.ready.then(() => { if (document.body.contains(T)) placeInd(); });
      }
      T.querySelectorAll('[data-t]').forEach(b => b.setAttribute('aria-selected', tab === b.dataset.t));
      placeInd();
    } else $('#tabs').hidden = true;
    if (tab === 'acc') { if (!$('#accForm')) accPane(); return; }
    if (tab === 'wipe') { if (!$('#wipeBox')) wipePane(); return; }
    const m = model(scores, status);
    const html = tab === 'results' ? resultsHTML(m) : tab === 'live' ? liveHTML(m) : judgesHTML(m);
    if (html !== last) {
      const fresh = !last, before = fresh || reduceM ? null : snap();
      last = html; $('#pane').innerHTML = html; wire();
      if (fresh) swapIn($('#pane')); else if (before) settle(before);
    }
  }
  function wipePane() {
    const COLS = ['scores', 'status'];
    $('#pane').innerHTML = `<div class="banner bad" id="wipeBox">
      <p style="margin-bottom:.4rem"><b>Delete all marks, rankings and submissions.</b></p>
      <label class="lbl" for="wipeIn">TYPE CLEAR TO CONFIRM</label>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap"><input class="field" id="wipeIn" autocomplete="off" style="max-width:220px">
        <button class="btn danger" type="button" id="wipeGo" disabled>Delete</button></div>
      <div class="note" id="wipeMsg" style="margin-top:.7rem"></div></div>`;
    const inp = $('#wipeIn'), go = $('#wipeGo'), msg = $('#wipeMsg');
    inp.oninput = () => { go.disabled = inp.value.trim() !== 'CLEAR'; };
    go.onclick = async () => { go.disabled = true; inp.disabled = true; let n = 0;
      try { for (const c of COLS) { const ids = await api.list(c); for (const id of ids) { await api.del(c, id); n++; msg.textContent = `Deleted ${n}…`; } }
        msg.innerHTML = `<span class="ok-t">Cleared ${n} records</span>`; }
      catch (er) { msg.innerHTML = `<span class="bad-t">Stopped after ${n}: ${esc(er.message || String(er))}</span>`; inp.disabled = false; } };
  }
  // staff logins: the listeners start once, the first time the tab is opened, and redraw only while it's showing
  let acc = null;
  function accPane() {
    if (acc) return acc();
    let list = [], locks = [], msgHTML = '';
    const pw = () => { const w = ['Pixel', 'Byte', 'Circuit', 'Vector', 'Quantum', 'Kernel', 'Matrix', 'Cipher', 'Neon', 'Turbo', 'Logic', 'Binary', 'Signal', 'Glitch'];
      const r = n => crypto.getRandomValues(new Uint32Array(1))[0] % n; return `${w[r(w.length)]}-${w[r(w.length)]}-${1000 + r(9000)}`; };
    const draw = () => {
      if (!document.body.contains($('#pane')) || tab !== 'acc') return;
      const keep = $('#aId') ? [$('#aId').value, $('#aPw').value, $('#aRole').value, $('#aLab').value] : null;
      $('#pane').innerHTML = `
        <div class="cert"><h3>NEW LOGIN</h3></div>
        <form id="accForm" class="form-grid glass">
          <div><label class="lbl" for="aId">LOGIN ID</label><input class="field" id="aId" required minlength="3" maxlength="30" pattern="[a-z0-9]+(-[a-z0-9]+)*" title="Lower-case letters, numbers and dashes" placeholder="e.g. teachers"></div>
          <div><label class="lbl" for="aPw">PASSWORD</label><div style="display:flex;gap:.4rem"><input class="field" id="aPw" required minlength="8"><button type="button" class="btn small" id="aGen">New</button></div></div>
          <div><label class="lbl" for="aRole">ROLE</label><select class="field" id="aRole">${Object.entries(ACCT_ROLES).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></div>
          <div><label class="lbl" for="aLab">DISPLAY NAME</label><input class="field" id="aLab" maxlength="40" placeholder="e.g. Teachers on duty"></div>
          <button class="btn primary" type="submit">Create login</button>
          <div class="msg" id="aMsg">${msgHTML}</div></form>
        <div class="cert"><h3>EXTRA LOGINS</h3></div>
        <div class="tscroll glass"><table class="res"><thead><tr><th>Login ID</th><th>Role</th><th>Name</th><th></th></tr></thead><tbody>
          ${list.length ? list.slice().sort((a, b) => a.id.localeCompare(b.id)).map(a => `<tr style="${a.disabled ? 'opacity:.45' : ''}"><td><b>${esc(a.id)}</b></td><td>${esc(ACCT_ROLES[a.role] || a.role)}</td><td>${esc(a.label || '')}</td>
            <td class="n"><button class="btn small" type="button" data-dis="${esc(a.id)}" data-v="${a.disabled ? 0 : 1}">${a.disabled ? 'Turn on' : 'Turn off'}</button></td></tr>`).join('')
            : '<tr><td colspan="4" class="note">None yet</td></tr>'}</tbody></table></div>
        <div class="cert"><h3>READY-MADE LOGINS</h3></div>
        <div class="tscroll glass"><table class="res"><thead><tr><th>Login ID</th><th>Who</th><th>Status</th><th></th></tr></thead><tbody>
          ${Object.entries(ROLE).filter(([id]) => id !== 'director').map(([id, r]) => { const L = locks.includes(id);
            return `<tr style="${L ? 'opacity:.6' : ''}"><td><b>${esc(id)}</b></td><td>${esc(r.label)}</td><td>${L ? '<span class="bad-t">Locked</span>' : '<span class="muted">Active</span>'}</td>
              <td class="n"><button class="btn small" type="button" data-lock="${esc(id)}" data-v="${L ? 0 : 1}">${L ? 'Unlock' : 'Lock'}</button></td></tr>`; }).join('')}</tbody></table></div>`;
      if (keep) { $('#aId').value = keep[0]; $('#aPw').value = keep[1]; $('#aRole').value = keep[2]; $('#aLab').value = keep[3]; } else $('#aPw').value = pw();
      $('#aGen').onclick = () => { $('#aPw').value = pw(); };
      $('#accForm').onsubmit = async e => { e.preventDefault();
        const id = $('#aId').value.trim().toLowerCase(), p = $('#aPw').value;
        const say = h => { msgHTML = h; $('#aMsg').innerHTML = h; };
        if (ROLE[id]) return say('<span class="bad-t">That ID is already one of the ready-made logins.</span>');
        say('Creating…');
        try { await api.createLogin(id, p);
          await api.save('accounts', id, { role: $('#aRole').value, label: $('#aLab').value.trim(), created: Date.now(), disabled: false });
          say(`<span class="ok-t">Created <b>${esc(id)}</b> · password <b>${esc(p)}</b></span>`);
          $('#aId').value = ''; $('#aLab').value = ''; $('#aPw').value = pw();
        } catch (er) { const c = er.code || er.message || '';
          say(`<span class="bad-t">${/already/.test(c) ? 'That login ID already exists.' : /weak/.test(c) ? 'Password is too weak (use at least 8 characters).' : 'Could not create the login: ' + esc(c)}</span>`); } };
      $('#pane').querySelectorAll('[data-dis]').forEach(b => b.onclick = () => api.save('accounts', b.dataset.dis, { disabled: b.dataset.v === '1' }));
      $('#pane').querySelectorAll('[data-lock]').forEach(b => b.onclick = () => { const id = b.dataset.lock;
        if (b.dataset.v === '1') { if (confirm(`Lock ${id}? Anyone using it is shut out straight away.`)) api.save('locks', id, { locked: true, at: Date.now() }); }
        else api.del('locks', id); });
    };
    acc = draw; draw();
    unsub.push(api.watch('accounts', d => { list = d; draw(); }));
    unsub.push(api.watch('locks', d => { locks = d.map(x => x.id); draw(); }));
  }
  if (isHead) {
    const bySc = {}, bySt = {};   // one filtered query per event: the database lets a head read only its own
    R.evs.forEach(ev => {
      unsub.push(api.watch('scores', d => { bySc[ev] = d; scores = Object.values(bySc).flat(); render(); }, { f: 'event', v: ev }));
      unsub.push(api.watch('status', d => { bySt[ev] = d; status = Object.values(bySt).flat(); render(); }, { f: 'event', v: ev }));
    });
  } else {
    unsub.push(api.watch('scores', d => { scores = d; render(); }));
    unsub.push(api.watch('status', d => { status = d; render(); }));
  }
}
</script>
</body>
</html>
