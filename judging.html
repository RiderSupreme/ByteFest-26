<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Judging · ByteFest 2026</title>
<meta name="description" content="ByteFest 2026 judging and results. For judges and organisers only.">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  /* same theme key as the main site, applied before first paint so light-mode users never see a dark flash */
  try { if (localStorage.getItem("bf-theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000000; --panel:#000614; --signal:#003DA6; --signal-hot:#4D8BFF; --ember:#0A2A6B;
  --bone:#EEF2FA; --ash:#8E9AB3; --grid:rgba(77,139,255,.08);
  --teal:#19D3C5; --teal-deep:#0B8F85; --teal-ink:#001a18; --sel:#065EAD;
  --glass-bg:rgba(255,255,255,.06); --glass-brd:rgba(25,211,197,.45); --glass-hi:rgba(255,255,255,.14);
  --glass-shadow:0 6px 28px rgba(0,0,0,.45);
  --bar:rgba(3,9,26,.72); --field:rgba(0,0,0,.38); --line:rgba(77,139,255,.18);
  --glow1:#001d5c; --glow2:#000512;
  --sk-body:#001a52; --sk-lit:#7FB0FF;
  --gold:#FFD36B; --silver:#D7E1F0; --bronze:#E0A36B; --ok:#19D3C5; --bad:#FF6B6B;
  --px:"Silkscreen","Courier New",monospace;
  --num:"Press Start 2P","Silkscreen","Courier New",monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  --void:#F2F4F9; --panel:#FFFFFF; --signal-hot:#0B4FBC; --ember:#C6D3E8;
  --bone:#131C30; --ash:#5A6579; --grid:rgba(0,61,166,.09);
  --teal:#0E9E93; --teal-deep:#0A6F67; --teal-ink:#ffffff; --sel:#4E92DE;
  --glass-bg:rgba(255,255,255,.62); --glass-brd:rgba(14,158,147,.5); --glass-hi:rgba(255,255,255,.85);
  --glass-shadow:0 6px 24px rgba(10,22,48,.12);
  --bar:rgba(247,249,253,.8); --field:rgba(255,255,255,.75); --line:rgba(0,61,166,.14);
  --glow1:#BBD5FA; --glow2:#F2F4F9;
  --sk-body:#8CA6CE; --sk-lit:#FFE0A8;
  --gold:#C99412; --silver:#7C8798; --bronze:#B06A2C; --ok:#0E9E93; --bad:#D64545;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--void)}
body{min-height:100vh;color:var(--bone);font-family:var(--mono);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px,
    radial-gradient(ellipse 90% 60% at 50% -10%,var(--glow1) 0%,var(--glow2) 60%,var(--void) 100%) fixed;
  transition:background-color .3s,color .3s}
::selection{background:var(--teal);color:var(--teal-ink)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
[hidden]{display:none!important}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
.px{font-family:var(--px);font-weight:400;letter-spacing:.05em}
.num{font-family:var(--num)}
.muted{color:var(--ash)}

/* glass, as on the main site */
.glass{position:relative;background:var(--glass-bg);border:1px solid var(--glass-brd);
  backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.2rem;
  font-family:var(--px);font-size:.74rem;letter-spacing:.06em;color:var(--bone);text-decoration:none;white-space:nowrap;
  background:var(--glass-bg);border:1px solid var(--glass-brd);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .2s,background .2s,color .2s,transform .15s}
.btn:hover{border-color:var(--teal)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:.5rem .8rem;font-size:.64rem}
.btn:disabled{opacity:.45;cursor:default;transform:none}
input.field,select.field,textarea.field{width:100%;padding:.8rem .9rem;background:var(--field);border:1px solid var(--glass-brd);outline:none;transition:border-color .2s,box-shadow .2s}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(25,211,197,.18)}
label.lbl{display:block;margin:1rem 0 .4rem;font-family:var(--px);font-size:.66rem;letter-spacing:.08em;color:var(--teal)}

/* skyline along the bottom of every screen: the same artwork as the site's hero and footer */
.skyline{position:fixed;left:0;right:0;bottom:0;z-index:0;pointer-events:none;line-height:0;opacity:.55}
.skyline svg{width:100%;height:auto;aspect-ratio:4/1;display:block;max-height:34vh}
.skyline::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--void) 100%);z-index:1}
.sk-body{fill:var(--sk-body)}
.sk-lit{fill:var(--sk-lit);opacity:.85}
#vLogin,#vApp{position:relative;z-index:1}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem 6rem}
.lbox{width:min(380px,100%);padding:2rem 1.6rem 1.8rem}
.lbox .logo{display:block;width:min(200px,64%);height:auto;margin:0 auto 1rem}
.pwwrap{position:relative}
.pwwrap .field{padding-right:4.6rem}
.pweye{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);padding:.35rem .55rem;font-family:var(--px);font-size:.6rem;
  letter-spacing:.06em;background:none;border:1px solid var(--line);color:var(--ash)}
.pweye:hover{color:var(--teal);border-color:var(--teal)}
.lbox .btn.primary{width:100%;margin-top:1.3rem;padding:.95rem}
.err{min-height:1.3em;margin-top:.8rem;font-size:.85rem;color:var(--bad);text-align:center}

/* ---------- TOP BAR ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bar);border-bottom:1px solid var(--glass-brd);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
.top .wrap{display:flex;align-items:center;gap:1rem;padding:.65rem 0}
.top .crest{display:flex;align-items:center;gap:.8rem;text-decoration:none;color:inherit}
.top .crest img{height:38px;width:auto}
:root:not([data-theme="light"]) .logo-day{display:none}
:root[data-theme="light"] .logo-night{display:none}
.top .app{padding-left:.8rem;border-left:1px solid var(--line);font-family:var(--px);font-size:.82rem;letter-spacing:.08em;line-height:1.15}
.top .app b{display:block;font-weight:400;color:var(--teal)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:.7rem}
.who{text-align:right;font-size:.78rem;line-height:1.3}
.who b{display:block;font-family:var(--px);font-weight:400;font-size:.72rem;letter-spacing:.05em;color:var(--signal-hot)}
.who span{color:var(--ash)}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .6rem;font-family:var(--px);font-size:.58rem;letter-spacing:.07em;
  border:1px solid var(--line);color:var(--ash);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.off i{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.pill.off{color:var(--gold)}
.themetog{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;padding:0;color:var(--teal);font-size:.95rem;
  background:var(--glass-bg);border:1px solid var(--glass-brd);transition:transform .2s,border-color .2s}
.themetog:hover{border-color:var(--teal);transform:rotate(-18deg)}
@media (max-width:760px){
  .top .wrap{flex-wrap:wrap;gap:.6rem}
  .top .crest img{height:30px}
  .top .app{font-size:.7rem}
  .top .right{width:100%;justify-content:space-between;margin:0}
  .who{text-align:left;order:-1;margin-right:auto}
}

/* ---------- SHARED LAYOUT ---------- */
main{padding:1.6rem 0 11rem}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1.4rem;flex-wrap:wrap;margin:.6rem 0 1.6rem}
.kicker{font-family:var(--px);font-size:.66rem;letter-spacing:.1em;color:var(--teal)}
.hero h2{margin:.4rem 0 0;font-family:var(--px);font-weight:700;font-size:clamp(1.7rem,4.6vw,2.5rem);line-height:1;color:var(--bone);
  text-shadow:4px 4px 0 var(--ember)}
.hero p{max-width:62ch;font-size:.9rem;color:var(--ash)}
.banner{padding:.85rem 1.1rem;margin-bottom:1rem;font-size:.88rem;border-left:3px solid var(--line);background:rgba(77,139,255,.06)}
.banner.ok{border-color:var(--teal);background:rgba(25,211,197,.09)}
.banner.warn{border-color:var(--gold);background:rgba(255,211,107,.08)}
.banner.bad{border-color:var(--bad);background:rgba(255,107,107,.08)}
.banner .btn{margin-left:.6rem}
.banner.bar-row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.empty{padding:2.4rem 1rem;text-align:center;color:var(--ash)}
.note{font-size:.8rem;color:var(--ash)}

/* progress box on the judge screen */
.prog{min-width:min(260px,100%);padding:.9rem 1.1rem}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:.8rem;color:var(--ash)}
.prog .row b{font-family:var(--num);font-weight:400;font-size:.95rem;color:var(--teal)}
.track{height:5px;margin:.6rem 0 0;background:rgba(127,127,127,.18)}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--signal),var(--teal));transition:width .4s}

/* scoring guide */
details.guide{margin-bottom:1.2rem}
details.guide summary{list-style:none;cursor:pointer;padding:.85rem 1.1rem;font-family:var(--px);font-size:.72rem;letter-spacing:.07em;color:var(--teal);
  display:flex;justify-content:space-between;align-items:center}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"+";font-size:1.1rem;transition:transform .3s}
details.guide[open] summary::after{transform:rotate(45deg)}
.rub{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.8rem;padding:0 1.1rem 1.1rem}
.rub div{padding:.8rem .9rem;background:var(--field);border-left:2px solid var(--teal)}
.rub small{display:block;font-family:var(--px);font-size:.58rem;letter-spacing:.07em;color:var(--ash)}
.rub b{display:block;margin:.2rem 0 .3rem;font-size:.92rem}
.rub .grp{grid-column:1/-1;margin-top:.3rem;font-family:var(--px);font-size:.62rem;letter-spacing:.1em;color:var(--teal)}
.lvl{list-style:none;margin-top:.5rem;font-size:.78rem;line-height:1.4;color:var(--ash)}
.lvl li{display:grid;grid-template-columns:1.4rem 1fr;gap:.3rem;padding:.2rem 0}
.lvl li b{display:block;margin:0;font-family:var(--num);font-size:.62rem;color:var(--teal)}
.rub p{font-size:.8rem;color:var(--ash);line-height:1.45}

/* ---------- JUDGE: one card per team ---------- */
.teams{display:grid;gap:1rem}
.team{padding:1.1rem 1.1rem 1rem;border-left-width:4px;border-left-color:var(--ember);transition:border-color .3s}
.team.scored{border-left-color:var(--teal)}
.team .th{display:flex;gap:1rem;align-items:flex-start;margin-bottom:.9rem}
.team .no{font-family:var(--px);font-size:.75rem;letter-spacing:.06em;color:var(--teal);padding:.35rem .5rem;border:1px solid var(--glass-brd);white-space:nowrap}
.team .nm{flex:1;min-width:0}
.team .nm b{display:block;font-size:1.02rem}
.team .nm div{font-size:.8rem;color:var(--ash)}
.team .tot{text-align:right;white-space:nowrap}
.team .tot b{font-family:var(--num);font-weight:400;font-size:1.05rem}
.team .tot span{display:block;font-size:.72rem;color:var(--ash)}
.grp.sm{margin:1rem 0 .1rem;font-family:var(--px);font-size:.62rem;letter-spacing:.1em;color:var(--teal)}
.cr{display:grid;grid-template-columns:minmax(150px,1fr) 3fr;gap:.4rem 1rem;align-items:center;padding:.55rem 0;border-top:1px dashed var(--line)}
.cr label{font-size:.85rem}
.cr label small{display:block;font-size:.7rem;color:var(--ash)}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:.3rem}
.lv button{height:40px;font-family:var(--num);font-size:.68rem;background:var(--field);border:1px solid var(--line);transition:background .15s,border-color .15s,color .15s}
.lv button:hover:not(:disabled){border-color:var(--teal)}
.lv button.on{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.lv button:disabled{cursor:default}
.cr input.field{max-width:9rem;font-family:var(--num);font-size:.85rem}
.cr input.badv{border-color:var(--bad)}
.team .st{margin-top:.5rem;font-family:var(--px);font-size:.6rem;letter-spacing:.07em;color:var(--ash)}
.team .st.ok{color:var(--teal)}
.team .st.err{color:var(--bad)}
@media (max-width:640px){ .cr{grid-template-columns:1fr} }

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);border-top:1px solid var(--glass-brd);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:.8rem 0 calc(.8rem + env(safe-area-inset-bottom))}
.dock .wrap{display:flex;align-items:center;gap:1rem;justify-content:space-between}
.dock .note{margin:0}

/* ---------- RESULTS ---------- */
.tabs{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1.3rem}
.tab{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem .85rem;font-family:var(--px);font-size:.66rem;letter-spacing:.05em;
  background:var(--glass-bg);border:1px solid var(--line);color:var(--bone);transition:border-color .2s,background .2s}
.tab:hover{border-color:var(--teal)}
.tab[aria-selected="true"]{border-color:var(--teal);background:rgba(25,211,197,.13)}
.tab.tool{border-style:dashed}
.jst{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .6rem;font-family:var(--px);font-size:.58rem;letter-spacing:.06em;
  border:1px solid var(--line);color:var(--ash);white-space:nowrap}
.chip.done{border-color:var(--teal);color:var(--teal)}
.chip.final{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
em.chip{font-style:normal;margin-left:.5rem;padding:.2rem .4rem;font-size:.5rem}
.chip.tie{border-color:var(--gold);color:var(--gold)}

.tiebar{margin:.2rem 0 .8rem;font-size:.82rem;color:var(--gold)}
.tscroll{overflow-x:auto;margin-bottom:1rem}
table.res{width:100%;border-collapse:collapse;font-size:.86rem}
.res th,.res td{padding:.7rem .75rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.res th{font-family:var(--px);font-weight:400;font-size:.6rem;letter-spacing:.07em;color:var(--teal);white-space:nowrap;background:rgba(127,127,127,.06)}
.res td.n,.res th.n{text-align:right;white-space:nowrap}
.res td.big{font-family:var(--num);font-size:.8rem;white-space:nowrap}
.res tr.r1 td.big:first-child{color:var(--gold)} .res tr.r2 td.big:first-child{color:var(--silver)} .res tr.r3 td.big:first-child{color:var(--bronze)}
.res .s{font-size:.76rem;color:var(--ash)}
@media (max-width:760px){ .hide-m{display:none} }

/* results: one drop-down per event */
.ev{margin-bottom:.8rem}
.ev summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.9rem;padding:1rem 1.1rem}
.ev summary::-webkit-details-marker{display:none}
.ev summary::after{content:"+";font-size:1.2rem;color:var(--teal);transition:transform .3s}
.ev[open] summary::after{transform:rotate(45deg)}
.ev .en{flex:1;font-family:var(--px);font-size:.95rem;letter-spacing:.05em}
.ev .body{padding:0 1.1rem .6rem}
.troph{padding:1.1rem 1.1rem .3rem;margin-top:1.6rem}
.troph .sec{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.lead{margin:.8rem 0 1rem;font-family:var(--px);font-weight:400;font-size:1.3rem;line-height:1.2;color:var(--gold)}
.lead small{display:block;margin-top:.35rem;font-size:.58rem;letter-spacing:.1em;color:var(--ash)}
.cert h3{margin:1.4rem 0 .6rem;font-family:var(--px);font-weight:400;font-size:.8rem;letter-spacing:.07em;color:var(--teal)}
.cert h3 .num{font-size:.62rem;color:var(--ash);margin-left:.6rem}

/* judge: ranking */
.rank{padding:1.1rem 1.1rem .6rem;margin-top:1rem}
.rank h3{margin-bottom:.4rem;font-family:var(--px);font-weight:400;font-size:.8rem;letter-spacing:.07em;color:var(--teal)}
.rk{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:.8rem;align-items:center;padding:.75rem 0;border-top:1px dashed var(--line)}
.rk .pos{font-family:var(--num);font-size:.7rem;color:var(--ash)}
.rk .nm b{display:block;font-size:.95rem}
.rk .nm div{font-size:.78rem;color:var(--ash)}
.rk .pts{font-family:var(--num);font-size:.95rem;text-align:right;white-space:nowrap}
.rk.done{grid-template-columns:3.2rem 1fr}
.rk.done .pos{color:var(--teal)}
.pk{display:flex;gap:.3rem}
.pk button{min-width:48px;height:40px;padding:0 .5rem;font-family:var(--px);font-size:.6rem;letter-spacing:.04em;background:var(--field);border:1px solid var(--line);transition:background .15s,border-color .15s}
.pk button:hover{border-color:var(--teal)}
.pk button.on.p1{background:var(--gold);border-color:var(--gold);color:#1a1200}
.pk button.on.p2{background:var(--silver);border-color:var(--silver);color:#10151f}
.pk button.on.p3{background:var(--bronze);border-color:var(--bronze);color:#1c0e00}
@media (max-width:640px){ .rk{grid-template-columns:1.6rem 1fr auto} .rk .pk{grid-column:1/-1} .pk button{flex:1} }

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;align-items:end;padding:1.1rem;margin-bottom:1.2rem}
.form-grid label.lbl{margin-top:0}
.msg{grid-column:1/-1;font-size:.86rem}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}

@media print{
  .top,.dock,.skyline,.tabs,.btn,.banner .btn{display:none!important}
  body{background:#fff;color:#000}
  .glass{background:none;box-shadow:none;border-color:#999;backdrop-filter:none}
  main{padding:0}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>

<div class="skyline" aria-hidden="true">
  <svg viewBox="0 0 1600 400" preserveAspectRatio="xMidYMax meet" shape-rendering="crispEdges">
    <defs><symbol id="skyline" viewBox="0 0 1600 400">
    <g class="sk-body">
      <!-- Emirates Towers (twin, triangular crowns) -->
      <rect x="48" y="182" width="40" height="218"/>
      <polygon points="48,182 68,138 88,182"/>
      <rect x="100" y="212" width="34" height="188"/>
      <polygon points="100,212 117,176 134,212"/>
      <!-- Dubai Frame -->
      <rect x="176" y="152" width="18" height="248"/>
      <rect x="252" y="152" width="18" height="248"/>
      <rect x="176" y="152" width="94" height="20"/>
      <!-- Burj Al Arab, the sail -->
      <polygon points="300,400 300,210 312,210 312,222 324,222 324,240 336,240 336,262 346,262 346,290 356,290 356,330 364,330 364,400"/>
      <!-- Atlantis The Palm (twin + central arch) -->
      <rect x="404" y="248" width="34" height="152"/>
      <rect x="404" y="234" width="34" height="14"/>
      <rect x="466" y="248" width="34" height="152"/>
      <rect x="466" y="234" width="34" height="14"/>
      <rect x="438" y="248" width="28" height="44"/>
      <!-- Museum of the Future (torus on podium) -->
      <rect x="548" y="358" width="56" height="42"/>
      <path fill-rule="evenodd" d="M576,296 m-46,0 a46,56 0 1,0 92,0 a46,56 0 1,0 -92,0 Z M576,296 m-20,0 a20,26 0 1,0 40,0 a20,26 0 1,0 -40,0 Z"/>
      <!-- Cayan Tower (the twist, as offset pixel courses) -->

<script type="module">
/* =====================================================================
   1) FIREBASE: paste the web-app config here (Firebase console → Project settings → Your apps).
      Leave apiKey empty and the page runs in demo mode, saving only in this browser.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: "",
};
// a login ID such as "judge1" signs in as judge1@<EMAIL_DOMAIN>. No email is ever sent there.
const EMAIL_DOMAIN = 'judging.bytefest26.app';
// Where each kind of record lives in Firestore. Prefixed so ByteFest never shares a collection with
// anything else in the same Firebase project. Keep in step with firestore.rules.
const COL = {
  scores:   'bytefest_scores',     // <judge>_<team no>: one judge's marks for one team
  status:   'bytefest_status',     // <judge>: { final, p1, p2, p3 }: submitted, and the 1st/2nd/3rd team numbers
  accounts: 'bytefest_accounts',   // <login id>: { role, label, disabled } for logins made in the Logins tab
  locks:    'bytefest_locks',      // <login id>: present while the director has locked that login
};

/* =====================================================================
   2) EVENTS, TEAMS AND RUBRICS: taken from each event's handbook.
      Criterion fields:
        n    name                              max  highest mark         min  lowest mark (default 0)
        g    heading to group it under         opt  true = can be left blank (bonus)
        d    one line on what is marked        lv   what each level means, lowest first, starting at `min`
      Marks up to 10 show as tap buttons (min…max); bigger maximums show a number box.
      tb (optional) = tie-break: groups of criterion numbers (1 = first criterion), compared in order after the
      total. Teams still level after that are left for the judge to separate.
      judges: how many judges the event has (default 2). With two, a team's score is the average of their totals.
      manual: true = no judges; the director records the placings (GameGrid).
      The database rules (firestore.rules) allow whole numbers 0 to 100 and up to 10 criteria.
   ===================================================================== */
const EVENTS = [
  { id: 'hackrush', name: 'HackRush', code: 'HR', arena: 'Code', grades: 'Grade 9–12', judges: 1,
    // marks per question = marks × (test cases passed ÷ total test cases), worked out from the submitted code
    tb: [[6, 7, 9], [3, 4, 5, 8]],   // handbook tie-break: more points on Hard questions, then on Medium ones
    rub: [
      { n: 'Q1 · Easy', max: 5, d: 'Marks for the share of test cases passed.' },
      { n: 'Q2 · Easy', max: 5, d: 'Marks for the share of test cases passed.' },
      { n: 'Q3 · Medium', max: 10, d: 'Marks for the share of test cases passed.' },
      { n: 'Q4 · Medium', max: 10, d: 'Marks for the share of test cases passed.' },
      { n: 'Q5 · Medium', max: 10, opt: true, d: 'Missing from the handbook table, but the main-round total of 80 needs a 10-mark Q5. Leave blank if there is no Q5.' },
      { n: 'Q6 · Hard', max: 20, d: 'Marks for the share of test cases passed.' },
      { n: 'Q7 · Hard', max: 20, d: 'Marks for the share of test cases passed.' },
      { n: 'Bonus 1 · Medium', max: 5, opt: true, g: 'Bonus', d: 'Marks for the share of test cases passed.' },
      { n: 'Bonus 2 · Hard', max: 5, opt: true, g: 'Bonus', d: 'Marks for the share of test cases passed.' },
    ] },
  { id: 'circuitriot', name: 'Circuit Riot', code: 'CR', arena: 'Robotics', grades: 'Grade 9–12', judges: 1,
    rub: [
      { n: 'Design round', g: 'Design round', min: 1, max: 5, d: 'Theme, circuit construction and the pitch to the judges.',
        lv: ['Theme barely visible, circuit incomplete, pitch unclear.', 'Theme basic, circuit lacks neatness, weak pitch.', 'Theme clearly visible, circuit neatly built, decent pitch.',
             'Strong theme visibility, sturdy circuit, well-delivered pitch.', 'Excellent Tron theme and circuit construction, strong pitch.'] },
      { n: 'Launch and acceleration', g: 'Velocity run and precision circuit', max: 5, d: 'One race scores both. A bot that leaves the track and cannot recover (DNF) scores 0.',
        lv: ['Delayed start, or needs a few tries to move.', 'Hesitant start, slow to reach speed.', 'Clean start, reaches speed quickly.', 'Quick, smooth launch.', 'Instant, smooth launch to full speed.'], min: 0 },
      { n: 'Junction handling', g: 'Velocity run and precision circuit', max: 5, min: 0, d: 'DNF scores 0.',
        lv: ['Misses most marked paths.', 'Takes the correct path with clear hesitation.', 'Takes most junctions correctly.', 'Takes all junctions correctly, with hesitation.', 'Takes every junction correctly and smoothly.'] },
      { n: '90° turns', g: 'Velocity run and precision circuit', max: 5, min: 0, d: 'DNF scores 0.',
        lv: ['Loses the line on most turns.', 'Completes turns slowly.', 'Completes most turns cleanly.', 'Clean turns with minor overshoot.', 'Sharp, clean turns with no overshoot.'] },
      { n: 'Speed consistency', g: 'Velocity run and precision circuit', max: 5, min: 0, d: 'DNF scores 0.',
        lv: ['Frequent stalls or stops.', 'Noticeable slowdowns and hesitation.', 'Mostly steady, with a few slowdowns.', 'Steady speed with rare hesitation.', 'Constant, smooth speed from start to finish.'] },
    ] },
  { id: 'codalo', name: 'Codalo', code: 'CD', arena: 'Robotics', grades: 'Grade 9–12',
    rub: [
      { n: 'Creativity', g: 'Round 1 · Titan', min: 1, max: 4,
        lv: ['Not at all creative, very few ideas.', 'Partially creative, few ideas.', 'Very creative, but details and ideas not implemented well.', 'Very creative, attention to detail and innovative ideas.'] },
      { n: 'Uniqueness', g: 'Round 1 · Titan', min: 1, max: 4,
        lv: ['Few to none originality and innovation.', 'Innovation and originality, but not implemented well.', 'New innovation and creativity, implemented but not accurately.', 'New, innovative ideas accurately implemented on the robot.'] },
      { n: 'Team work', g: 'Round 1 · Titan', min: 1, max: 4,
        lv: ['No well-coordinated teamwork.', 'Some teamwork or commitment to the project.', 'Well coordinated, but members did not contribute equally.', 'Exceptional teamwork and commitment from all members.'] },
      { n: 'Question and answer', g: 'Round 1 · Titan', min: 1, max: 4,
        lv: ['Unable to answer any of the judges’ questions.', 'Answers some questions, not with complete clarity.', 'Answers accurately, but not within the time limit.', 'Answers all questions with accuracy, within the time limit.'] },
      { n: 'SDG bonus', g: 'Round 1 · Titan', max: 4, opt: true, d: 'Bonus for addressing the SDGs. The handbook gives no maximum: 4 is a placeholder.' },
      { n: 'Robot.IO battle points', g: 'Round 2 · Robot.IO', max: 40, d: 'Total from the battles: push out 3, flip 10, durability 0–5, hold 4 (over 90°) or 3, then minus 5 wrong size, minus 1 per extra minute (max minus 3), minus 3 sportsmanship. Enter 0 if the total is negative. The handbook gives no maximum: 40 is a placeholder.' },
    ] },
  { id: 'vybecode', name: 'VybeCode', code: 'VC', arena: 'AI', grades: 'Grade 7–10',
    rub: [
      { n: 'Creativity and innovation', min: 1, max: 3, d: 'Uniqueness and originality of the idea.',
        lv: ['Partially creative ideas, but lacks depth or originality.', 'Very creative, but some innovative ideas not fully executed.', 'Highly original, with exceptional innovation and unique ideas.'] },
      { n: 'Practicality and usability', min: 1, max: 3, d: 'Effectiveness and real-world potential.',
        lv: ['Potential utility, but user experience and execution are weak.', 'Core feature functional and practical, with minor UX/UI flaws.', 'Outstanding real-world application: practical, intuitive and effective.'] },
      { n: 'Efficiency of tool usage', min: 1, max: 3, d: 'Judged on the number of prompts sent, tallied by the table volunteer.',
        lv: ['Moderate prompt usage, redundant requests for basic functionality.', 'Efficient prompts, a working feature with minor extra prompts.', 'Fully functional feature with minimal, well-structured prompts.'] },
      { n: 'Collaboration and presentation', min: 1, max: 3, d: 'Clarity of explanation, teamwork and the final pitch.',
        lv: ['Covers basic points, but lacks structure, clarity or engaging delivery.', 'Well structured and clear, but could be more engaging.', 'Exceptional pitch: engaging, clear, professional and well structured.'] },
      { n: 'Team dynamics', min: 1, max: 3, d: 'Cooperation, balance and cohesion in the team.',
        lv: ['Basic teamwork, but roles and contributions unbalanced.', 'Well coordinated, but members did not share technical understanding equally.', 'Exceptional cohesion: clear roles, all members contribute confidently.'] },
      { n: 'Wow factor', g: 'Bonus', max: 3, opt: true, d: 'Overall polish, creativity and visual impact. Extra marks for seamless UI/UX, clever interactive touches or a standout pitch. 0 if none.',
        lv: ['Minor visual touches, but no memorable “magic” element.', 'Good polish, smooth UI/UX touches that catch the judges’ attention.', 'Outstanding polish: stunning UI/UX, seamless interaction or an unforgettable feature.'] },
    ] },
  // GameGrid has no judges or marks: two single-elimination knockouts, each decided by who wins the game.
  // manual = the director records the top three of each arena from the bracket. Not counted in the rolling trophy.
  { id: 'fc26', name: 'GameGrid · FC26', code: 'FC', arena: 'E-sports', grades: 'Grade 9–12', judges: 0, manual: true, rub: [] },
  { id: 'rocketleague', name: 'GameGrid · Rocket League', code: 'RL', arena: 'E-sports', grades: 'Grade 9–12', judges: 0, manual: true, rub: [] },
  { id: 'nexai', name: 'Nex.AI', code: 'NX', arena: 'AI', grades: 'Grade 9–12',
    rub: [
      { n: 'Workflow setup and tool use', g: 'Round 1', min: 1, max: 3,
        lv: ['Automation broken, fails to read files, or uses paid tools.', 'Works fine with minor setup issues or slight delays.', 'Runs smoothly with free tools (n8n/Make) and AI nodes, no errors or broken links.'] },
      { n: 'AI agent and team interview', g: 'Round 1', min: 1, max: 3,
        lv: ['No MCQ chat interaction; the report is generated without interviewing the team.', 'Basic chat loop with simple or poorly structured MCQs, minimal team input.', 'Great interactive loop that asks clear MCQs to capture team ideas and steer the report.'] },
      { n: 'Report quality and clarity', g: 'Round 1', min: 1, max: 3,
        lv: ['Superficial or confusing report that misses the main problems.', 'Decent report covering general problems with basic details.', 'Clear, detailed audit report that points out 3 real problems.'] },
      { n: 'Problem choice and trade-offs', g: 'Round 1', min: 1, max: 3,
        lv: ['Unrealistic problem choice, poor reasoning, no staff plan.', 'Decent choice with basic explanation and simple staff plans.', 'Smart choice with clear reasoning, realistic trade-offs and a good plan for moving staff.'] },
      { n: 'Slides and 2-minute pitch', g: 'Round 1', min: 1, max: 3,
        lv: ['Messy presentation, missing slides, or way over time.', 'Good slides and clear presentation, slightly over time or rushed.', 'Clean, easy-to-read 7-slide deck presented confidently within 2 minutes.'] },
      { n: 'Solution build and real impact', g: 'Round 2', min: 1, max: 3,
        lv: ['Incomplete build, missing improvement plan, or vague goals.', 'Solid 4-week build with a basic improvement plan and simple goals.', 'Impressive working automation, clear 5-month improvement plan, measurable goals.'] },
      { n: 'Sticking to limits (50 hrs, 3 people, $0)', g: 'Round 2', min: 1, max: 3,
        lv: ['Broke the dev-hour limit, used too many operators, or spent money on paid tools.', 'Minor planning slip-ups, still within budget and team limits.', 'Completely within all limits: under 50 hours, max 3 operators, $0 spent.'] },
      { n: 'Long-term system maintenance', g: 'Round 2', min: 1, max: 3,
        lv: ['Unrealistic plan that would break down as soon as the team leaves.', 'Basic handoff plan with slight long-term risks.', 'Simple, practical handoff plan so current staff can easily manage the system.'] },
      { n: 'Pitch and Q&A answers', g: 'Round 2', min: 1, max: 3,
        lv: ['Unconvincing pitch, or unable to answer simple questions about the build.', 'Clear presentation with decent answers to most questions.', 'Great pitch and confident answers, explaining both tech and business choices.'] },
    ] },
];
// what the rolling trophy adds up for each team: 'raw' = the marks as scored, 'percent' = marks as a percentage of the
// event's maximum, so that an event marked out of 90 doesn't outweigh one marked out of 18
const TROPHY_BASIS = 'percent';
const RUB = Object.fromEntries(EVENTS.map(E => [E.id, E.rub]));
// PLACEHOLDER teams: replaced with the registrations before the event
const TEAMS_ARE_EXAMPLES = true;
EVENTS.forEach(E => {
  E.teams = ['A', 'B', 'C', 'D'].map((l, i) => ({
    no: `${E.code}-0${i + 1}`, team: `Example team ${l}`, school: i % 2 ? 'Example School Two' : 'Example School One',
    members: `Student ${l}1, Student ${l}2`,
  }));
});

/* =====================================================================
   3) LOGINS: every ready-made login ID and what it opens. Create each one in Firebase
      Authentication (see SETUP.md). More can be made later from the director's Logins tab.
   ===================================================================== */
const ROLE = {}, JUDGES_OF = {};
let jn = 0;   // judge1, judge2, … numbered in EVENTS order, each event taking its share
EVENTS.forEach(E => { JUDGES_OF[E.id] = [];
  for (let k = 0; k < (E.judges ?? 2); k++) { const id = 'judge' + (++jn); JUDGES_OF[E.id].push(id);
    ROLE[id] = { kind: 'judge', ev: E.id, grp: 'Judges', label: `Judge ${jn} · ${E.name}` }; } });
// event heads (student and teacher leads share one login per event): live scores for their own event only
[['hackrush', 'HackRush', ['hackrush']], ['circuitriot', 'Circuit Riot', ['circuitriot']], ['codalo', 'Codalo', ['codalo']],
 ['vybecode', 'VybeCode', ['vybecode']], ['gamegrid', 'GameGrid', ['fc26', 'rocketleague']], ['nexai', 'Nex.AI', ['nexai']]]
  .forEach(([k, name, evs]) => { ROLE['head-' + k] = { kind: 'head', evs, name, grp: 'Event heads', label: name + ' head' }; });
Object.assign(ROLE, {
  results1: { kind: 'results', grp: 'Results', label: 'Results 1' },
  results2: { kind: 'results', grp: 'Results', label: 'Results 2' },
  results3: { kind: 'results', grp: 'Results', label: 'Results 3' },
  admin:    { kind: 'admin', grp: 'Admin', label: 'Admin' },
  director: { kind: 'director', grp: 'Director', label: 'Director' },
});
const ACCT_ROLES = { results: 'Results (events and trophy)', admin: 'Admin (live scores)' };
/* ===================================================================== */

const EV = Object.fromEntries(EVENTS.map(E => [E.id, E]));
const TEAMS = Object.fromEntries(EVENTS.flatMap(E => E.teams.map(t => [t.no, { ...t, ev: E }])));
const cmax = c => c.max;
const cmin = c => c.min ?? 0;
const EMAX = ev => RUB[ev].reduce((a, c) => a + cmax(c), 0);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------- theme: shares the main site's switch ---------------- */
(() => {
  const b = $('#themetog');
  const paint = () => { const light = document.documentElement.getAttribute('data-theme') === 'light';
    b.textContent = light ? '☾' : '☀'; b.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode'); };
  b.onclick = () => { const light = document.documentElement.getAttribute('data-theme') !== 'light';
    if (light) document.documentElement.setAttribute('data-theme', 'light'); else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('bf-theme', light ? 'light' : 'dark'); } catch (e) {} paint(); };
  paint();
})();

/* ---------------- data layer: Firebase, or a demo that lives in this browser ---------------- */
let api;
if (firebaseConfig.apiKey) {
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(firebaseConfig), auth = A.getAuth(app);
  const db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() });   // keeps working through Wi-Fi drops and syncs later
  const ref = col => { if (!COL[col]) throw new Error('unknown collection ' + col); return F.collection(db, COL[col]); };
  const doc = (col, id) => F.doc(ref(col), id);
  api = {
    demo: false,
    onUser: cb => A.onAuthStateChanged(auth, u => cb(u && u.email ? u.email.split('@')[0] : null)),
    login: (id, pw) => A.signInWithEmailAndPassword(auth, `${id}@${EMAIL_DOMAIN}`, pw),
    logout: () => A.signOut(auth),
    getDoc: async (col, id) => { const d = await F.getDoc(doc(col, id)); return d.exists() ? d.data() : null; },
    // a second Firebase app creates the new login, so the director stays signed in
    createLogin: async (id, pw) => { const app2 = initializeApp(firebaseConfig, 'creator-' + Date.now()), a2 = A.getAuth(app2);
      await A.createUserWithEmailAndPassword(a2, `${id}@${EMAIL_DOMAIN}`, pw); await A.signOut(a2); },
    save: (col, id, data) => F.setDoc(doc(col, id), { ...data, updatedAt: F.serverTimestamp() }, { merge: true }),
    del: (col, id) => F.deleteDoc(doc(col, id)),
    list: async col => (await F.getDocs(ref(col))).docs.map(d => d.id),
    watch: (col, cb, by) => F.onSnapshot(by ? F.query(ref(col), F.where(by.f, '==', by.v)) : ref(col), { includeMetadataChanges: true },
      s => cb(s.docs.map(d => ({ id: d.id, ...d.data(), _pending: d.metadata.hasPendingWrites })))),
  };
} else {
  // demo: localStorage + BroadcastChannel, so two tabs on this device see each other's changes
  let bc = null; try { bc = new BroadcastChannel('bf-judging'); } catch (e) {}
  const subs = new Set(); let mem = {};
  const read = () => { try { return JSON.parse(localStorage.getItem('bf-judging-demo') || '{}'); } catch (e) { return mem; } };
  const write = d => { mem = d; try { localStorage.setItem('bf-judging-demo', JSON.stringify(d)); } catch (e) {} };
  const emit = () => subs.forEach(f => f()); if (bc) bc.onmessage = emit;
  let userCb;
  api = {
    demo: true,
    onUser: cb => { userCb = cb; let u = null; try { u = sessionStorage.getItem('bf-judging-user'); } catch (e) {} setTimeout(() => cb(u)); },
    login: async (id, pw) => { const L = read().logins || {};
      if (!(ROLE[id] && pw.trim().toLowerCase() === 'demo') && !(L[id] && L[id] === pw)) throw new Error('auth/invalid-credential');
      try { sessionStorage.setItem('bf-judging-user', id); } catch (e) {} userCb(id); },
    logout: async () => { try { sessionStorage.removeItem('bf-judging-user'); } catch (e) {} userCb(null); },
    getDoc: async (col, id) => (read()[col] || {})[id] || null,
    createLogin: async (id, pw) => { const d = read(); d.logins ??= {}; if (ROLE[id] || d.logins[id]) throw new Error('auth/email-already-in-use'); d.logins[id] = pw; write(d); },
    save: async (col, id, data) => { const d = read(); d[col] ??= {}; d[col][id] = { ...(d[col][id] || {}), ...data, updatedAt: Date.now() }; write(d); bc && bc.postMessage(1); emit(); },
    del: async (col, id) => { const d = read(); if (d[col]) delete d[col][id]; write(d); bc && bc.postMessage(1); emit(); },
    list: async col => Object.keys(read()[col] || {}),
    watch: (col, cb, by) => { const f = () => cb(Object.entries(read()[col] || {}).map(([id, v]) => ({ id, ...v })).filter(x => !by || x[by.f] === by.v)); subs.add(f); f(); return () => subs.delete(f); },
  };
}

/* ---------------- scoring maths ---------------- */
// the judge's total for one team, or null until every required criterion has a mark
const total = s => { if (!s) return null; const R = RUB[s.event]; if (!R) return null; let t = 0;
  for (let i = 0; i < R.length; i++) { const v = s['c' + (i + 1)]; if (Number.isInteger(v)) t += v; else if (!R[i].opt) return null; } return t; };
const time = t => { const d = t?.toDate ? t.toDate() : t ? new Date(t) : null; return d ? d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : ''; };
const ordn = n => ['1st', '2nd', '3rd'][n - 1];
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');

// everything the results, admin and director screens show, worked out from the raw records.
// A team's score is the average of its judges' totals. The order is that score, then the event's tie-break groups,
// then the judges' own 1st/2nd/3rd picks (3, 2, 1 points each). A tie that survives all of that is flagged.
function model(scores, status) {
  const lex = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
  const evs = EVENTS.map(E => {
    const J = JUDGES_OF[E.id], sts = J.map(j => status.find(x => x.id === j) || {});
    const submitted = sts.filter(x => x.final).length, final = E.manual ? !!(status.find(x => x.id === 'pod_' + E.id) || {}).p1 : submitted === J.length;
    const order = (status.find(x => x.id === 'tb_' + E.id) || {}).order || [], dv = no => { const k = order.indexOf(no); return k < 0 ? 99 : k; };
    const pod = E.manual ? (status.find(x => x.id === 'pod_' + E.id) || {}) : null;
    const borda = {}; if (pod) [pod.p1, pod.p2, pod.p3].forEach((no, k) => { if (no) borda[no] = 3 - k; });
    sts.forEach(x => [x.p1, x.p2, x.p3].forEach((no, k) => { if (no) borda[no] = (borda[no] || 0) + 3 - k; }));
    const rows = E.teams.map(t => {
      const per = J.map(j => { const s = scores.find(x => x.judge === j && x.no === t.no); return { j, s, T: total(s) }; });
      const got = per.filter(p => p.T !== null);
      const T = got.length ? Math.round(10 * got.reduce((a, p) => a + p.T, 0) / got.length) / 10 : null;
      const tbv = (E.tb || []).map(g => got.length ? got.reduce((a, p) => a + g.reduce((x, n) => x + (Number.isInteger(p.s['c' + n]) ? p.s['c' + n] : 0), 0), 0) / got.length : 0);
      return { ...t, per, T, tbv, borda: borda[t.no] || 0, full: got.length === J.length, place: 0, tie: false };
    });
    rows.sort((a, b) => (b.T ?? -1) - (a.T ?? -1) || lex(b.tbv, a.tbv) || b.borda - a.borda || dv(a.no) - dv(b.no) || a.no.localeCompare(b.no));
    if (final) { let pl = 0; rows.forEach((r, i) => { const p = rows[i - 1];
      const same = p && r.T !== null && r.T === p.T && lex(r.tbv, p.tbv) === 0 && r.borda === p.borda && dv(r.no) === dv(p.no);
      if (!same) pl = i + 1; r.place = pl <= 3 ? pl : 0; if (same && pl <= 3) { r.tie = true; p.tie = true; } }); }
    const judges = J.map((j, k) => ({ id: j, final: !!sts[k].final, entered: rows.filter(r => r.per[k].T !== null).length, started: rows.some(r => r.per[k].s) }));
    return { E, judges, final, submitted, pod, decided: order.length > 0, entered: rows.filter(r => r.full).length, started: judges.some(j => j.started), rows };
  });
  return { evs, judged: evs.filter(e => e.final).length };
}
// school standings for the rolling trophy: every team's points added up across every event.
// finalOnly counts judged events only; otherwise whatever has been scored so far.
function schools(m, finalOnly) {
  const map = new Map();
  Object.values(TEAMS).forEach(t => { if (!map.has(norm(t.school))) map.set(norm(t.school), { school: t.school, total: 0, by: {} }); });
  m.evs.forEach(e => { if (e.E.manual || (finalOnly && !e.final)) return;
    e.rows.forEach(r => { if (r.T === null) return; const x = map.get(norm(r.school));
      const pts = TROPHY_BASIS === 'percent' ? Math.round(1000 * r.T / EMAX(e.E.id)) / 10 : r.T;
      x.total = Math.round(10 * (x.total + pts)) / 10; x.by[e.E.id] = Math.round(10 * ((x.by[e.E.id] || 0) + pts)) / 10; }); });
  const L = [...map.values()].sort((a, b) => b.total - a.total || a.school.localeCompare(b.school));
  let r = 0; L.forEach((x, i) => { if (i === 0 || x.total !== L[i - 1].total) r = i + 1; x.rank = r; });
  return L;
}

/* ---------------- JUDGE ----------------
   score every team, then rank them: the judge picks 1st, 2nd and 3rd from the list ordered by points
   (this settles any tie), then submits, which locks the login.
   override: the director editing this judge's marks and picks; nothing locks, and there's a way back */
function judgeView(E, me, R, override) {
  const C = RUB[E.id], MX = EMAX(E.id), PN = Math.min(3, E.teams.length);
  $('#whoName').textContent = override ? 'Director' : R.label;
  $('#whoRole').textContent = override ? 'Editing ' + R.label : E.arena + ' arena';
  const S = {}, pk = { 1: '', 2: '', 3: '' }, timers = {}, pend = {};
  let final = false, pending = false, picksTimer = null, built = false;
  const team = no => E.teams.find(t => t.no === no);
  const tname = no => { const t = team(no); return t ? `${t.team} (${t.no})` : ''; };
  const sc = no => total(S[no]);
  // total first, then any tie-break groups (HackRush: points on Hard questions, then on Medium)
  const key = no => { const s = S[no], k = [total(s)];
    (E.tb || []).forEach(g => k.push(g.reduce((a, n) => a + (Number.isInteger(s?.['c' + n]) ? s['c' + n] : 0), 0))); return k; };
  const cmpKey = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
  const allScored = () => E.teams.every(t => sc(t.no) !== null);
  const ordered = () => E.teams.map(t => ({ t, T: sc(t.no), K: key(t.no) })).filter(r => r.T !== null).sort((a, b) => cmpKey(b.K, a.K) || a.t.no.localeCompare(b.t.no));
  // the podium has to follow the points; the judge only decides between teams on equal points
  function check() {
    const want = [1, 2, 3].slice(0, PN), miss = want.filter(p => !team(pk[p]));
    if (miss.length) return { ok: false, need: 'Choose ' + miss.map(ordn).join(', '), bad: '' };
    let bad = '';
    for (let i = 1; i < PN && !bad; i++) if (cmpKey(key(pk[i]), key(pk[i + 1])) < 0) bad = `${tname(pk[i + 1])} ranks higher than ${tname(pk[i])}, so it has to place above it.`;
    if (!bad) { const low = key(pk[PN]), over = E.teams.find(t => !want.some(p => pk[p] === t.no) && cmpKey(key(t.no), low) > 0);
      if (over) bad = `${tname(over.no)} ranks higher than your ${ordn(PN)} place.`; }
    return { ok: !bad, need: '', bad };
  }
  const control = (t, c, i) => c.max <= 10
    ? `<div class="lv" role="radiogroup" aria-label="${esc(t.no + ' ' + c.n)}" data-c="c${i + 1}">${Array.from({ length: c.max - cmin(c) + 1 }, (_, k) => k + cmin(c)).map(v =>
        `<button type="button" role="radio" aria-checked="false" data-v="${v}">${v}</button>`).join('')}</div>`
    : `<input class="field" inputmode="numeric" pattern="[0-9]*" maxlength="2" data-c="c${i + 1}" placeholder="0–${c.max}" aria-label="${esc(t.no + ' ' + c.n)}">`;
  const card = no => document.querySelector(`.team[data-no="${CSS.escape(no)}"]`);
  // a heading above the first criterion of each group (rounds, bonus)
  const grp = (C, i, small) => C[i].g && (i === 0 || C[i - 1].g !== C[i].g) ? `<div class="grp${small ? ' sm' : ''}">${esc(C[i].g.toUpperCase())}</div>` : '';

  function build() {
    built = true;
    $('#main').innerHTML = `
      <div class="hero">
        <div><span class="kicker">${esc(R.label.toUpperCase())}${TEAMS_ARE_EXAMPLES ? ' · EXAMPLE TEAMS' : ''}</span><h2>${esc(E.name)}</h2></div>
        <div class="prog glass"><div class="row"><span>SCORED</span><b id="pTxt">0/0</b></div><div class="track"><i id="pBar"></i></div></div>
      </div>
      ${override ? `<div class="banner warn bar-row"><span>Editing <b>${esc(R.label)}</b></span><button class="btn small" id="bBack" type="button">&lsaquo; Back</button></div>` : ''}
      <details class="guide glass"><summary>SCORING GUIDE</summary>
        <div class="rub">${C.map((c, i) => `${grp(C, i)}<div><small>${cmin(c) ? cmin(c) + ' TO ' : 'OUT OF '}${cmax(c)}${c.opt ? ' · OPTIONAL' : ''}</small><b>${esc(c.n)}</b>${c.d ? `<p>${esc(c.d)}</p>` : ''}
          ${c.lv ? `<ol class="lvl" start="${cmin(c) || 1}">${c.lv.map((t, k) => `<li><b>${k + (cmin(c) === 0 && c.lv.length === c.max ? 1 : cmin(c))}</b>${esc(t)}</li>`).join('')}</ol>` : ''}</div>`).join('')}</div></details>
      <div class="teams">${E.teams.map(t => `
        <article class="team glass" data-no="${esc(t.no)}">
          <div class="th"><span class="no">${esc(t.no)}</span>
            <div class="nm"><b>${esc(t.team)}</b><div>${esc(t.school)}</div><div>${esc(t.members)}</div></div>
            <div class="tot"><b>–</b><span>/ ${MX}</span></div></div>
          ${C.map((c, i) => `${grp(C, i, true)}<div class="cr"><label>${esc(c.n)}<small>${cmin(c) ? cmin(c) + ' to ' : '/ '}${cmax(c)}${c.opt ? ' · optional' : ''}</small></label>${control(t, c, i)}</div>`).join('')}
          <div class="st" data-st>NOT SCORED</div>
        </article>`).join('')}</div>
      <section class="rank glass"><h3>RANKING</h3><div id="rankBox"></div></section>`;
    if (!override) {
      const dock = document.createElement('div'); dock.className = 'dock';
      dock.innerHTML = `<div class="wrap"><span class="note" id="fTxt"></span><button class="btn primary" id="bFinal" type="button" disabled>Submit</button></div>`;
      $('#main').appendChild(dock);
      $('#bFinal').onclick = submit;
    } else $('#bBack').onclick = () => { stopAll(); staffView('director', 'judges'); scrollTo(0, 0); };
    document.querySelectorAll('.team').forEach(el => {
      const no = el.dataset.no;
      el.querySelectorAll('.lv button').forEach(b => b.onclick = () => {
        const was = b.classList.contains('on');   // tapping the chosen mark again clears it
        b.parentElement.querySelectorAll('button').forEach(x => { x.classList.remove('on'); x.setAttribute('aria-checked', 'false'); });
        if (!was) { b.classList.add('on'); b.setAttribute('aria-checked', 'true'); } queue(no); });
      el.querySelectorAll('input.field').forEach(inp => inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 2);
        const c = C[+inp.dataset.c.slice(1) - 1]; inp.classList.toggle('badv', inp.value !== '' && +inp.value > c.max); queue(no); }));
    });
    $('#rankBox').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return;
      const p = +b.dataset.p, no = b.dataset.no;
      if (pk[p] === no) pk[p] = ''; else { [1, 2, 3].forEach(q => { if (pk[q] === no) pk[q] = ''; }); pk[p] = no; }
      savePicks(); rank(); };
    E.teams.forEach(t => { if (S[t.no]) { fill(t.no, S[t.no]); paint(t.no, S[t.no], false); } });
    progress();
  }
  const readCard = no => { const el = card(no), d = { event: E.id, judge: me, no };
    C.forEach((c, i) => { const k = 'c' + (i + 1);
      if (c.max <= 10) { const on = el.querySelector(`.lv[data-c="${k}"] button.on`); d[k] = on ? +on.dataset.v : null; }
      else { const inp = el.querySelector(`input[data-c="${k}"]`); d[k] = inp.value === '' ? null : Math.min(c.max, +inp.value); } });
    d.comment = ''; return d; };
  function queue(no) {
    clearTimeout(timers[no]); const st = card(no).querySelector('[data-st]'); st.className = 'st'; st.textContent = 'SAVING…';
    const d = readCard(no); S[no] = { ...(S[no] || {}), ...d }; pend[no] = d; paint(no, S[no], true);
    timers[no] = setTimeout(() => commit(no), 450);
  }
  function commit(no) {
    const d = pend[no]; if (!d) return; delete pend[no]; delete timers[no];
    api.save('scores', `${me}_${no}`, d).catch(err => { const st = card(no)?.querySelector('[data-st]'); if (st) { st.className = 'st err'; st.textContent = 'NOT SAVED: CHECK THE CONNECTION'; } console.error(err); });
  }
  const flush = () => Object.keys(pend).forEach(no => { clearTimeout(timers[no]); commit(no); });
  function savePicks() {
    clearTimeout(picksTimer);
    picksTimer = setTimeout(() => { picksTimer = null;
      const d = { event: E.id, judge: me, p1: pk[1], p2: pk[2], p3: pk[3] }; if (!override) d.final = false;   // a draft, so a refresh keeps the choice
      api.save('status', me, d).catch(console.error); }, 450);
  }
  function fill(no, s) { const el = card(no);
    C.forEach((c, i) => { const k = 'c' + (i + 1), v = s[k];
      if (c.max <= 10) el.querySelectorAll(`.lv[data-c="${k}"] button`).forEach(b => { const on = v != null && +b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
      else { const inp = el.querySelector(`input[data-c="${k}"]`); if (document.activeElement !== inp) inp.value = v ?? ''; } }); }
  function paint(no, s, local) {
    const el = card(no); if (!el) return; const T = total(s);
    el.querySelector('.tot b').textContent = T ?? '–'; el.classList.toggle('scored', T !== null);
    const st = el.querySelector('[data-st]');
    if (!local) { st.className = 'st' + (T !== null ? ' ok' : '');
      st.textContent = T !== null ? (s._pending ? 'SYNCING…' : `SAVED ${time(s.updatedAt)}`)
        : C.some((c, i) => s['c' + (i + 1)] != null) ? 'INCOMPLETE' : 'NOT SCORED'; }
    progress();
  }
  function progress() {
    if (!built) return;
    const n = E.teams.length, k = E.teams.filter(t => sc(t.no) !== null).length;
    $('#pTxt').textContent = `${k}/${n}`; $('#pBar').style.width = (n ? 100 * k / n : 0) + '%';
    rank();
  }
  // the list of teams in descending order of points, with a 1st / 2nd / 3rd button on each
  function rank() {
    const box = $('#rankBox'); if (!box) return;
    const n = E.teams.length, k = E.teams.filter(t => sc(t.no) !== null).length;
    let c = null;
    if (k < n) box.innerHTML = `<p class="note">Appears once every team is scored (${k} of ${n}).</p>`;
    else {
      const L = ordered(); c = check();
      box.innerHTML = L.map((r, i) => { const same = x => cmpKey(x.K, r.K) === 0, tie = L.filter(same).length > 1 && L.findIndex(same) < PN;
        return `<div class="rk"><span class="pos">${i + 1}</span>
          <div class="nm"><b>${esc(r.t.team)}</b><div>${esc(r.t.no)} · ${esc(r.t.school)}</div></div>
          <span class="pts">${r.T}${tie ? '<em class="chip tie">TIED</em>' : ''}</span>
          <div class="pk">${[1, 2, 3].slice(0, PN).map(p => `<button type="button" class="p${p}${pk[p] === r.t.no ? ' on' : ''}" data-p="${p}" data-no="${esc(r.t.no)}" aria-pressed="${pk[p] === r.t.no}">${ordn(p).toUpperCase()}</button>`).join('')}</div></div>`; }).join('')
        + (c.bad ? `<div class="err" style="text-align:left">${esc(c.bad)}</div>` : '');
    }
    if ($('#bFinal')) {
      $('#fTxt').textContent = k < n ? `${n - k} to score` : c.need || (c.bad ? 'Fix the ranking' : 'Ready to submit');
      $('#bFinal').disabled = !(k === n && c && c.ok);
    }
  }
  async function submit() {
    if (!allScored() || !check().ok) return;
    const list = [1, 2, 3].slice(0, PN).map(p => `${ordn(p)}: ${tname(pk[p])}`).join('\n');
    if (!confirm(`Submit your final scores?\n\n${list}\n\nThis locks your login. You won't be able to change anything afterwards.`)) return;
    flush(); clearTimeout(picksTimer); picksTimer = null;
    api.save('status', me, { event: E.id, judge: me, final: true, p1: pk[1], p2: pk[2], p3: pk[3] })
      .catch(err => { alert('Could not submit. Check the connection and try again.'); console.error(err); });
  }
  function locked() {
    built = false;
    $('#main').innerHTML = `
      <div class="hero"><div><span class="kicker">${esc(R.label.toUpperCase())}</span><h2>Submitted</h2></div></div>
      <div class="banner ok">Your scores and ranking are final. This login is now locked.${pending ? ' Syncing…' : ''}</div>
      <div class="rank glass">${[1, 2, 3].slice(0, PN).map(p => `<div class="rk done"><span class="pos">${ordn(p).toUpperCase()}</span>
        <div class="nm"><b>${esc(team(pk[p])?.team || '')}</b><div>${esc(pk[p])} · ${esc(team(pk[p])?.school || '')}</div></div></div>`).join('')}</div>`;
  }
  unsub.push(api.watch('scores', docs => {
    docs.forEach(s => { if (timers[s.no]) return; S[s.no] = s; if (built && card(s.no)) { fill(s.no, s); paint(s.no, s, false); } });
    progress();
  }, { f: 'judge', v: me }));
  unsub.push(api.watch('status', docs => {
    const d = docs.find(x => x.id === me) || {};
    final = !!d.final; pending = !!d._pending;
    if (!picksTimer) [1, 2, 3].forEach(p => { pk[p] = d['p' + p] || ''; });
    if (final && !override) return locked();
    if (!built) build(); else rank();
  }, { f: 'judge', v: me }));
}

/* ---------------- RESULTS / ADMIN / DIRECTOR ----------------
   results:  each event once judged (places and scores), plus the rolling-trophy school standings
   admin:    live scores of every team in every event, by event or by school
   director: all of that, plus judges (edit marks, unlock), logins, and clearing test data */
function staffView(kind, startTab, R) {
  const isDir = kind === 'director', isHead = kind === 'head';
  $('#whoName').textContent = isDir ? 'Director' : isHead ? R.label : kind === 'admin' ? 'Admin' : 'Results';
  $('#whoRole').textContent = isDir ? 'Full control' : isHead ? 'Live scores' : kind === 'admin' ? 'Live scores' : 'Event results';
  let tab = startTab || (kind === 'admin' || isHead ? 'live' : 'results'), mode = 'event', scores = [], status = [], last = '';
  const open = new Set(), podDraft = {};
  const TABS = isDir ? [['results', 'Results'], ['live', 'Live scores'], ['judges', 'Judges'], ['acc', 'Logins'], ['wipe', 'Reset']] : [];
  $('#main').innerHTML = `
    <div class="hero"><div><span class="kicker">${isDir ? 'DIRECTOR' : isHead ? 'EVENT HEAD' : kind === 'admin' ? 'LIVE' : 'BYTEFEST 2026'}${TEAMS_ARE_EXAMPLES ? ' · EXAMPLE TEAMS' : ''}</span>
      <h2>${isDir ? 'Control' : isHead ? esc(R.name) : kind === 'admin' ? 'Live scores' : 'Results'}</h2></div></div>
    <div class="tabs" role="tablist" id="tabs"></div><div id="pane"></div>`;
  $('#pane').addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.id) d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id); }, true);
  const where = r => `${esc(r.no)} · ${esc(r.school)}`;

  function resultsHTML(m) {
    // the results logins see only the winner, and only once every event is judged; admin and director see the standings
    const winnerOnly = kind === 'results';
    const L = schools(m, true), done = m.judged === EVENTS.length, lead = L.filter(x => x.rank === 1 && x.total > 0);
    const evs = m.evs.map(e => { const E = e.E;
      const multi = e.judges.length > 1, tied = e.rows.some(r => r.tie);
      if (E.manual) {
        const pod = e.pod || {}, dr = podDraft[E.id] || (podDraft[E.id] = { 1: pod.p1 || '', 2: pod.p2 || '', 3: pod.p3 || '' });
        const sel = p => `<div><label class="lbl" for="pod${E.id}${p}">${ordn(p).toUpperCase()}</label><select class="field" id="pod${E.id}${p}" data-pod="${E.id}|${p}"><option value="">Choose…</option>
          ${E.teams.map(t => `<option value="${esc(t.no)}"${dr[p] === t.no ? ' selected' : ''}>${esc(t.team)} (${esc(t.no)}) · ${esc(t.school)}</option>`).join('')}</select></div>`;
        const form = kind === 'director' ? `<div class="form-grid glass">${[1, 2, 3].slice(0, Math.min(3, E.teams.length)).map(sel).join('')}
          <button class="btn primary" type="button" data-savepod="${E.id}">Save placings</button></div>` : '';
        const table = e.final ? `<div class="tscroll"><table class="res"><thead><tr><th>Place</th><th>Team</th></tr></thead><tbody>
          ${e.rows.filter(r => r.place).map(r => `<tr class="r${r.place}"><td class="big">${ordn(r.place).toUpperCase()}</td><td><b>${esc(r.team)}</b><div class="s">${where(r)}</div><div class="s">${esc(r.members)}</div></td></tr>`).join('')}</tbody></table></div>`
          : (kind === 'director' ? '' : '<p class="note" style="padding:.2rem 0 .5rem">Not decided yet.</p>');
        return `<details class="ev glass" data-id="${E.id}" ${open.has(E.id) ? 'open' : ''}><summary><span class="en">${esc(E.name)}</span>
          <span class="chip ${e.final ? 'final' : ''}">${e.final ? 'DECIDED' : 'PENDING'}</span></summary><div class="body">${form}${table}</div></details>`;
      }
      const body = !e.final ? '<p class="note" style="padding:.2rem 0 .5rem">Not judged yet.</p>'
        : `${tied ? `<p class="tiebar">Teams marked TIE are level on everything, including the judges’ rankings. ${kind === 'director' ? 'Choose who goes first.' : 'The director decides these.'}</p>` : ''}
          ${kind === 'director' && e.decided ? `<p class="tiebar"><button class="btn small" type="button" data-cleartb="${E.id}">Undo tie decision</button></p>` : ''}
          <div class="tscroll"><table class="res"><thead><tr><th>Place</th><th>Team</th><th class="n">${multi ? 'Average' : 'Score'} / ${EMAX(E.id)}</th></tr></thead><tbody>
            ${e.rows.map(r => `<tr class="${r.place ? 'r' + r.place : ''}"><td class="big">${r.place ? ordn(r.place).toUpperCase() : '–'}${r.tie ? '<em class="chip tie">TIE</em>' : ''}</td>
              <td><b>${esc(r.team)}</b><div class="s">${where(r)}</div><div class="s">${esc(r.members)}</div>${kind === 'director' && r.tie ? `<button class="btn small" type="button" style="margin-top:.5rem" data-first="${E.id}|${esc(r.no)}">Place first</button>` : ''}</td><td class="n big">${r.T ?? '–'}</td></tr>`).join('')}</tbody></table></div>`;
      return `<details class="ev glass" data-id="${E.id}" ${open.has(E.id) ? 'open' : ''}><summary><span class="en">${esc(E.name)}</span>
        <span class="chip ${e.final ? 'final' : ''}">${e.final ? 'JUDGED' : 'PENDING' + (multi ? ` · ${e.submitted} OF ${e.judges.length}` : '')}</span></summary><div class="body">${body}</div></details>`; }).join('');
    const trophy = `<section class="troph glass"><div class="sec"><span class="kicker">ROLLING TROPHY</span>
        <span class="chip ${done ? 'final' : ''}">${m.judged} OF ${EVENTS.length} EVENTS JUDGED</span></div>
      ${winnerOnly
        ? (done && lead.length ? `<h3 class="lead">${esc(lead.map(x => x.school).join(' & '))}<small>${lead.length > 1 ? 'TIED OVERALL' : 'OVERALL WINNER'}</small></h3>`
          : '<p class="note" style="margin:.8rem 0 1.2rem">Announced once every event is judged.</p>')
        : (lead.length ? `<h3 class="lead">${esc(lead.map(x => x.school).join(' & '))}<small>${done ? (lead.length > 1 ? 'TIED OVERALL' : 'OVERALL WINNER') : 'LEADING SO FAR'}</small></h3>` : '<p class="note" style="margin:.8rem 0">No events judged yet.</p>')
        + schoolTable(L)}</section>`;
    return evs + trophy;
  }
  const schoolTable = L => `<div class="tscroll"><table class="res"><thead><tr><th>#</th><th>School</th>${EVENTS.filter(E => !E.manual).map(E => `<th class="n hide-m">${esc(E.code)}</th>`).join('')}<th class="n">Points</th></tr></thead><tbody>
    ${L.map(x => `<tr class="${x.total && x.rank === 1 ? 'r1' : ''}"><td class="big">${x.total ? x.rank : '–'}</td><td><b>${esc(x.school)}</b></td>
      ${EVENTS.filter(E => !E.manual).map(E => `<td class="n hide-m">${x.by[E.id] ?? '–'}</td>`).join('')}<td class="n big">${x.total}</td></tr>`).join('')}</tbody></table></div>`;

  function liveHTML(m) {
    const tog = `<div class="tabs"><button class="tab" type="button" data-mode="event" aria-selected="${mode === 'event'}">By event</button>
      <button class="tab" type="button" data-mode="school" aria-selected="${mode === 'school'}">By school</button></div>`;
    if (isHead || mode === 'event') return (isHead ? '' : tog) + m.evs.filter(e => !isHead || R.evs.includes(e.E.id)).map(e => { const E = e.E, multi = e.judges.length > 1;
      return `<div class="cert"><h3>${esc(E.name.toUpperCase())}</h3><div class="jst">${E.manual ? '' : `<span class="chip ${e.entered === E.teams.length ? 'done' : ''}">${e.entered}/${E.teams.length} SCORED</span>`}
        <span class="chip ${e.final ? 'final' : ''}">${E.manual ? (e.final ? 'DECIDED' : 'NOT DECIDED') : e.final ? 'SUBMITTED' : e.started ? `JUDGING${multi ? ` · ${e.submitted} OF ${e.judges.length} SUBMITTED` : ''}` : 'NOT STARTED'}</span></div>
        <div class="tscroll glass"><table class="res"><thead><tr><th>Team</th>${e.judges.map(j => `<th class="n">${esc(ROLE[j.id].label.split(' · ')[0])}</th>`).join('')}${multi ? '<th class="n">Average</th>' : ''}<th>Place</th></tr></thead><tbody>
          ${e.rows.map(r => `<tr class="${r.place ? 'r' + r.place : ''}"><td><b>${esc(r.team)}</b><div class="s">${where(r)}</div></td>
            ${r.per.map(p => `<td class="n big">${p.T ?? '–'}</td>`).join('')}${multi ? `<td class="n big">${r.T ?? '–'}</td>` : ''}
            <td class="big">${r.place ? ordn(r.place).toUpperCase() : '–'}${r.tie ? '<em class="chip tie">TIE</em>' : ''}</td></tr>`).join('')}</tbody></table>${E.manual ? '' : `<div class="s" style="padding:.5rem .8rem">Out of ${EMAX(E.id)}</div>`}</div></div>`; }).join('');
    const L = schools(m, false);
    return tog + `<div class="cert"><h3>STANDINGS<span class="num">${m.judged === EVENTS.length ? 'FINAL' : 'LIVE'}</span></h3><div class="glass" style="padding:.2rem 1rem">${schoolTable(L)}</div></div>`
      + L.map(x => { const k = norm(x.school);
        return `<div class="cert"><h3>${esc(x.school.toUpperCase())}<span class="num">${x.total} PTS</span></h3><div class="tscroll glass"><table class="res"><thead><tr><th>Event</th><th>Team</th><th class="n">Score</th></tr></thead><tbody>
          ${m.evs.flatMap(e => e.rows.filter(r => norm(r.school) === k).map(r => `<tr><td>${esc(e.E.name)}</td><td><b>${esc(r.team)}</b><div class="s">${esc(r.no)}</div></td><td class="n big">${r.T ?? '–'}</td></tr>`)).join('')
            || '<tr><td colspan="3" class="note">No teams</td></tr>'}</tbody></table></div></div>`; }).join('');
  }

  function judgesHTML(m) {
    return `<div class="tscroll glass"><table class="res"><thead><tr><th>Event</th><th>Judge</th><th class="n">Scored</th><th>Status</th><th></th></tr></thead><tbody>
      ${m.evs.flatMap(e => e.judges.map(j => `<tr><td><b>${esc(e.E.name)}</b></td><td>${esc(ROLE[j.id].label.split(' · ')[0])}<div class="s">${esc(j.id)}</div></td>
        <td class="n big">${j.entered}/${e.E.teams.length}</td>
        <td><span class="chip ${j.final ? 'final' : ''}">${j.final ? 'SUBMITTED' : j.started ? 'JUDGING' : 'NOT STARTED'}</span></td>
        <td class="n"><button class="btn small" type="button" data-edit="${j.id}">Edit</button>${j.final ? ` <button class="btn small" type="button" data-unlock="${j.id}">Unlock</button>` : ''}</td></tr>`)).join('')}</tbody></table></div>`;
  }
  function wire() {
    $('#pane').querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; render(); });
    $('#pane').querySelectorAll('[data-pod]').forEach(x => x.onchange = () => { const [ev, p] = x.dataset.pod.split('|'); (podDraft[ev] ||= {})[p] = x.value; });
    $('#pane').querySelectorAll('[data-savepod]').forEach(b => b.onclick = () => { const ev = b.dataset.savepod, E = EV[ev], dr = podDraft[ev] || {}, n = Math.min(3, E.teams.length);
      const picks = [1, 2, 3].slice(0, n).map(p => dr[p] || '');
      if (picks.some(x => !x)) return alert('Choose a team for every place.');
      if (new Set(picks).size < picks.length) return alert('The same team is chosen twice.');
      api.save('status', 'pod_' + ev, { event: ev, p1: picks[0] || '', p2: picks[1] || '', p3: picks[2] || '' }); });
    $('#pane').querySelectorAll('[data-first]').forEach(b => b.onclick = () => { const [ev, no] = b.dataset.first.split('|');
      const e = model(scores, status).evs.find(x => x.E.id === ev), me = e.rows.find(r => r.no === no);
      const group = e.rows.filter(r => r.tie && r.place === me.place).map(r => r.no);
      api.save('status', 'tb_' + ev, { event: ev, order: [no, ...group.filter(x => x !== no)] }); });
    $('#pane').querySelectorAll('[data-cleartb]').forEach(b => b.onclick = () => api.del('status', 'tb_' + b.dataset.cleartb));
    $('#pane').querySelectorAll('[data-unlock]').forEach(b => b.onclick = () => confirm(`Let ${b.dataset.unlock} change their scores again?`) && api.save('status', b.dataset.unlock, { final: false }));
    $('#pane').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const jid = b.dataset.edit; stopAll(); judgeView(EV[ROLE[jid].ev], jid, ROLE[jid], true); scrollTo(0, 0); });
  }
  // forms (logins, clearing data) keep their own state, so live updates don't redraw over what's being typed
  function render() {
    if (TABS.length) {
      $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab${k === 'acc' || k === 'wipe' ? ' tool' : ''}" role="tab" data-t="${k}" aria-selected="${tab === k}">${l}</button>`).join('');
      $('#tabs').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { if (tab === b.dataset.t) return; tab = b.dataset.t; last = ''; $('#pane').innerHTML = ''; render(); });
    } else $('#tabs').hidden = true;
    if (tab === 'acc') { if (!$('#accForm')) accPane(); return; }
    if (tab === 'wipe') { if (!$('#wipeBox')) wipePane(); return; }
    const m = model(scores, status);
    const html = tab === 'results' ? resultsHTML(m) : tab === 'live' ? liveHTML(m) : judgesHTML(m);
    if (html !== last) { last = html; $('#pane').innerHTML = html; wire(); }
  }
  function wipePane() {
    const COLS = ['scores', 'status'];
    $('#pane').innerHTML = `<div class="banner bad" id="wipeBox">
      <p style="margin-bottom:.4rem"><b>Delete all marks, rankings and submissions.</b></p>
      <label class="lbl" for="wipeIn">TYPE CLEAR TO CONFIRM</label>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap"><input class="field" id="wipeIn" autocomplete="off" style="max-width:220px">
        <button class="btn danger" type="button" id="wipeGo" disabled>Delete</button></div>
      <div class="note" id="wipeMsg" style="margin-top:.7rem"></div></div>`;
    const inp = $('#wipeIn'), go = $('#wipeGo'), msg = $('#wipeMsg');
    inp.oninput = () => { go.disabled = inp.value.trim() !== 'CLEAR'; };
    go.onclick = async () => { go.disabled = true; inp.disabled = true; let n = 0;
      try { for (const c of COLS) { const ids = await api.list(c); for (const id of ids) { await api.del(c, id); n++; msg.textContent = `Deleted ${n}…`; } }
        msg.innerHTML = `<span class="ok-t">Cleared ${n} records</span>`; }
      catch (er) { msg.innerHTML = `<span class="bad-t">Stopped after ${n}: ${esc(er.message || String(er))}</span>`; inp.disabled = false; } };
  }
  // staff logins: the listeners start once, the first time the tab is opened, and redraw only while it's showing
  let acc = null;
  function accPane() {
    if (acc) return acc();
    let list = [], locks = [], msgHTML = '';
    const pw = () => { const w = ['Pixel', 'Byte', 'Circuit', 'Vector', 'Quantum', 'Kernel', 'Matrix', 'Cipher', 'Neon', 'Turbo', 'Logic', 'Binary', 'Signal', 'Glitch'];
      const r = n => crypto.getRandomValues(new Uint32Array(1))[0] % n; return `${w[r(w.length)]}-${w[r(w.length)]}-${1000 + r(9000)}`; };
    const draw = () => {
      if (!document.body.contains($('#pane')) || tab !== 'acc') return;
      const keep = $('#aId') ? [$('#aId').value, $('#aPw').value, $('#aRole').value, $('#aLab').value] : null;
      $('#pane').innerHTML = `
        <div class="cert"><h3>NEW LOGIN</h3></div>
        <form id="accForm" class="form-grid glass">
          <div><label class="lbl" for="aId">LOGIN ID</label><input class="field" id="aId" required minlength="3" maxlength="30" pattern="[a-z0-9]+(-[a-z0-9]+)*" title="Lower-case letters, numbers and dashes" placeholder="e.g. teachers"></div>
          <div><label class="lbl" for="aPw">PASSWORD</label><div style="display:flex;gap:.4rem"><input class="field" id="aPw" required minlength="8"><button type="button" class="btn small" id="aGen">New</button></div></div>
          <div><label class="lbl" for="aRole">ROLE</label><select class="field" id="aRole">${Object.entries(ACCT_ROLES).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></div>
          <div><label class="lbl" for="aLab">DISPLAY NAME</label><input class="field" id="aLab" maxlength="40" placeholder="e.g. Teachers on duty"></div>
          <button class="btn primary" type="submit">Create login</button>
          <div class="msg" id="aMsg">${msgHTML}</div></form>
        <div class="cert"><h3>EXTRA LOGINS</h3></div>
        <div class="tscroll glass"><table class="res"><thead><tr><th>Login ID</th><th>Role</th><th>Name</th><th></th></tr></thead><tbody>
          ${list.length ? list.slice().sort((a, b) => a.id.localeCompare(b.id)).map(a => `<tr style="${a.disabled ? 'opacity:.45' : ''}"><td><b>${esc(a.id)}</b></td><td>${esc(ACCT_ROLES[a.role] || a.role)}</td><td>${esc(a.label || '')}</td>
            <td class="n"><button class="btn small" type="button" data-dis="${esc(a.id)}" data-v="${a.disabled ? 0 : 1}">${a.disabled ? 'Turn on' : 'Turn off'}</button></td></tr>`).join('')
            : '<tr><td colspan="4" class="note">None yet</td></tr>'}</tbody></table></div>
        <div class="cert"><h3>READY-MADE LOGINS</h3></div>
        <div class="tscroll glass"><table class="res"><thead><tr><th>Login ID</th><th>Who</th><th>Status</th><th></th></tr></thead><tbody>
          ${Object.entries(ROLE).filter(([id]) => id !== 'director').map(([id, r]) => { const L = locks.includes(id);
            return `<tr style="${L ? 'opacity:.6' : ''}"><td><b>${esc(id)}</b></td><td>${esc(r.label)}</td><td>${L ? '<span class="bad-t">Locked</span>' : '<span class="muted">Active</span>'}</td>
              <td class="n"><button class="btn small" type="button" data-lock="${esc(id)}" data-v="${L ? 0 : 1}">${L ? 'Unlock' : 'Lock'}</button></td></tr>`; }).join('')}</tbody></table></div>`;
      if (keep) { $('#aId').value = keep[0]; $('#aPw').value = keep[1]; $('#aRole').value = keep[2]; $('#aLab').value = keep[3]; } else $('#aPw').value = pw();
      $('#aGen').onclick = () => { $('#aPw').value = pw(); };
      $('#accForm').onsubmit = async e => { e.preventDefault();
        const id = $('#aId').value.trim().toLowerCase(), p = $('#aPw').value;
        const say = h => { msgHTML = h; $('#aMsg').innerHTML = h; };
        if (ROLE[id]) return say('<span class="bad-t">That ID is already one of the ready-made logins.</span>');
        say('Creating…');
        try { await api.createLogin(id, p);
          await api.save('accounts', id, { role: $('#aRole').value, label: $('#aLab').value.trim(), created: Date.now(), disabled: false });
          say(`<span class="ok-t">Created <b>${esc(id)}</b> · password <b>${esc(p)}</b></span>`);
          $('#aId').value = ''; $('#aLab').value = ''; $('#aPw').value = pw();
        } catch (er) { const c = er.code || er.message || '';
          say(`<span class="bad-t">${/already/.test(c) ? 'That login ID already exists.' : /weak/.test(c) ? 'Password is too weak (use at least 8 characters).' : 'Could not create the login: ' + esc(c)}</span>`); } };
      $('#pane').querySelectorAll('[data-dis]').forEach(b => b.onclick = () => api.save('accounts', b.dataset.dis, { disabled: b.dataset.v === '1' }));
      $('#pane').querySelectorAll('[data-lock]').forEach(b => b.onclick = () => { const id = b.dataset.lock;
        if (b.dataset.v === '1') { if (confirm(`Lock ${id}? Anyone using it is shut out straight away.`)) api.save('locks', id, { locked: true, at: Date.now() }); }
        else api.del('locks', id); });
    };
    acc = draw; draw();
    unsub.push(api.watch('accounts', d => { list = d; draw(); }));
    unsub.push(api.watch('locks', d => { locks = d.map(x => x.id); draw(); }));
  }
  if (isHead) {
    const bySc = {}, bySt = {};   // one filtered query per event: the database lets a head read only its own
    R.evs.forEach(ev => {
      unsub.push(api.watch('scores', d => { bySc[ev] = d; scores = Object.values(bySc).flat(); render(); }, { f: 'event', v: ev }));
      unsub.push(api.watch('status', d => { bySt[ev] = d; status = Object.values(bySt).flat(); render(); }, { f: 'event', v: ev }));
    });
  } else {
    unsub.push(api.watch('scores', d => { scores = d; render(); }));
    unsub.push(api.watch('status', d => { status = d; render(); }));
  }
}
</script>
</body>
</html>
